<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #202020;
            --fg: #cccccc;
            --fg-alt: #888888;
            --accent: #76b9ed;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        /* Segoe Fluent Icons */
        .icon { font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons'; font-size: 14px; }

        #container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }
        #pagCanvas { max-width: 100%; max-height: 100%; }

        /* Control bar - auto hide like VideoViewer */
        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 32px;
            background: rgba(30,30,30,0.92);
            display: flex; align-items: center;
            padding: 0 8px;
            opacity: 1;
            transition: opacity 0.3s ease;
            z-index: 10;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        /* Buttons - match VideoViewer CaptionButtonStyle */
        .btn {
            background: transparent; border: none; color: var(--fg);
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 2px;
            transition: background 0.1s;
            flex-shrink: 0;
        }
        .btn:hover { background: rgba(255,255,255,0.08); }
        .btn:active { background: rgba(255,255,255,0.12); }
        .btn.active { color: var(--accent); }

        /* Progress bar - match VideoViewer PositionSliderStyle */
        #progressWrap {
            flex: 1; height: 10px; margin: 0 6px;
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }
        #progressBg {
            position: absolute; left: 10px; right: 10px;
            height: 1px; background: rgba(255,255,255,0.2);
            top: 50%; transform: translateY(-50%);
        }
        #progressFill {
            position: absolute; left: 10px; width: 0;
            height: 1px; background: var(--fg);
            top: 50%; transform: translateY(-50%);
        }
        /* Thumb - same as VideoViewer PositionSliderThumbTemplate (circle) */
        #progressThumb {
            position: absolute; left: 10px;
            width: 10px; height: 10px;
            border: 1px solid var(--fg);
            border-radius: 50%; background: transparent;
            top: 50%; transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 0.15s, background 0.15s;
            z-index: 2;
        }
        #progressWrap:hover #progressThumb { opacity: 1; }
        #progressWrap.dragging #progressThumb { opacity: 1; background: var(--fg); }
        #progressWrap:hover #progressFill { height: 2px; }
        #progressWrap:hover #progressBg { height: 2px; }

        /* Time - match VideoViewer buttonTime style */
        #time {
            color: var(--fg); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px; text-align: center;
            flex-shrink: 0; white-space: nowrap;
        }

        /* Status */
        #status {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-alt); font-size: 13px;
        }

        /* Info overlay */
        #info {
            position: absolute; top: 8px; right: 8px;
            color: var(--fg-alt); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #info.show { opacity: 1; }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="pagCanvas"></canvas>
        <div id="info"></div>
        <div id="controls">
            <!-- Play/Pause: \xE768=Play \xE769=Pause -->
            <button class="btn" id="btnPlayPause" title="Play / Pause">
                <span class="icon">&#xE768;</span>
            </button>
            <!-- Loop: \xE8D8=off \xE777=on (UpdateRestore) -->
            <button class="btn active" id="btnLoop" title="Loop">
                <span class="icon">&#xE777;</span>
            </button>
            <div id="progressWrap">
                <div id="progressBg"></div>
                <div id="progressFill"></div>
                <div id="progressThumb"></div>
            </div>
            <span id="time">00:00 / 00:00</span>
        </div>
        <div id="status">Loading...</div>
    </div>

    <script>
    (function() {
        var statusEl = document.getElementById('status');
        var canvas = document.getElementById('pagCanvas');
        var controls = document.getElementById('controls');
        var btnPlay = document.getElementById('btnPlayPause');
        var btnLoop = document.getElementById('btnLoop');
        var progressWrap = document.getElementById('progressWrap');
        var progressFill = document.getElementById('progressFill');
        var progressThumb = document.getElementById('progressThumb');
        var timeEl = document.getElementById('time');
        var infoEl = document.getElementById('info');

        var pag = null, pagFile = null, pagView = null;
        var isPlaying = false, isLooping = true, isDragging = false;
        var duration = 0;
        var hideTimer = null;

        // Segoe Fluent Icons codes
        var ICON_PLAY = '\uE768';
        var ICON_PAUSE = '\uE769';
        var ICON_LOOP_OFF = '\uE8D8';
        var ICON_LOOP_ON = '\uE777';

        // --- Auto-hide controls (like VideoViewer) ---
        function showControls() {
            controls.classList.remove('hidden');
            infoEl.classList.add('show');
            resetHideTimer();
        }
        function hideControls() {
            if (isDragging) return;
            controls.classList.add('hidden');
            infoEl.classList.remove('show');
        }
        function resetHideTimer() {
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(hideControls, 1500);
        }
        document.addEventListener('mousemove', showControls);
        document.addEventListener('mousedown', showControls);

        // --- Format time (like VideoViewer TimeTickToShortStringConverter) ---
        function fmt(us) {
            var s = us / 1000000;
            var m = Math.floor(s / 60);
            var sec = Math.floor(s % 60);
            return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
        }

        function log(msg) {
            console.log('[PAG] ' + msg);
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage({type:'log', message:msg});
        }

        // --- Load PAG file ---
        async function loadFile(base64, libpagSrc, wasmSrc) {
            try {
                statusEl.textContent = 'Loading libpag...';
                if (!pag) {
                    var s = document.createElement('script');
                    s.src = libpagSrc;
                    document.head.appendChild(s);
                    await new Promise(function(ok, fail) { s.onload=ok; s.onerror=function(){fail(new Error('load libpag.js failed'))}; });
                    statusEl.textContent = 'Initializing...';
                    pag = await window.libpag.PAGInit({locateFile:function(){return wasmSrc}});
                    log('PAG initialized');
                }

                if (pagView) { try{pagView.destroy();}catch(e){} pagView=null; }
                if (pagFile) { try{pagFile.destroy();}catch(e){} pagFile=null; }

                statusEl.textContent = 'Decoding...';
                var raw = atob(base64);
                var buf = new Uint8Array(raw.length);
                for (var i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i);
                var ab = buf.buffer.slice(buf.byteOffset, buf.byteOffset+buf.byteLength);

                pagFile = await pag.PAGFile.load(ab);
                if (!pagFile) { statusEl.textContent='Invalid PAG file'; return; }

                duration = pagFile.duration();
                var w = pagFile.width(), h = pagFile.height();
                infoEl.textContent = w + '\u00d7' + h;
                canvas.width = w; canvas.height = h;

                pagView = await pag.PAGView.init(pagFile, canvas, {useScale:false});
                if (!pagView) { statusEl.textContent='Failed to create view'; return; }

                pagView.setRepeatCount(0);

                pagView.addListener('onAnimationUpdate', function() {
                    if (!isDragging && pagView) {
                        var p = pagView.getProgress();
                        updateProgress(p);
                    }
                });

                pagView.addListener('onAnimationEnd', function() {
                    if (!isLooping) { isPlaying=false; updatePlayBtn(); }
                });

                await pagView.play();
                isPlaying = true;
                updatePlayBtn();
                statusEl.style.display = 'none';
                log('Playing');

                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'loaded', width:w, height:h});
            } catch(err) {
                statusEl.textContent = 'Error: ' + err.message;
                log('Error: ' + err.message);
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'error', message:err.message});
            }
        }

        function updateProgress(p) {
            var pct = (p * 100).toFixed(2) + '%';
            progressFill.style.width = 'calc(' + pct + ' - 10px)';
            progressThumb.style.left = 'calc(' + pct + ')';
            timeEl.textContent = fmt(duration * p) + ' / ' + fmt(duration);
        }

        function updatePlayBtn() {
            btnPlay.querySelector('.icon').textContent = isPlaying ? ICON_PAUSE : ICON_PLAY;
        }

        // --- Progress bar interaction ---
        function getProgressFromEvent(e) {
            var rect = progressWrap.getBoundingClientRect();
            return Math.max(0, Math.min(1, (e.clientX - rect.left - 10) / (rect.width - 20)));
        }

        progressWrap.addEventListener('mousedown', function(e) {
            isDragging = true;
            progressWrap.classList.add('dragging');
            var p = getProgressFromEvent(e);
            updateProgress(p);
            if (pagView) pagView.setProgress(p);
        });
        document.addEventListener('mousemove', function(e) {
            if (isDragging) {
                var p = getProgressFromEvent(e);
                updateProgress(p);
                if (pagView) pagView.setProgress(p);
            }
        });
        document.addEventListener('mouseup', function() {
            isDragging = false;
            progressWrap.classList.remove('dragging');
        });

        // --- Buttons ---
        btnPlay.addEventListener('click', function() {
            if (!pagView) return;
            if (isPlaying) { pagView.pause(); isPlaying=false; }
            else { pagView.play(); isPlaying=true; }
            updatePlayBtn();
        });

        btnLoop.addEventListener('click', function() {
            isLooping = !isLooping;
            btnLoop.classList.toggle('active', isLooping);
            btnLoop.querySelector('.icon').textContent = isLooping ? ICON_LOOP_ON : ICON_LOOP_OFF;
            if (pagView) pagView.setRepeatCount(isLooping ? 0 : 1);
        });

        // --- Messages from C# ---
        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'loadFile') loadFile(msg.base64, msg.libpagSrc, msg.wasmSrc);
        });

        // --- Ready ---
        log('Page ready');
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage({type:'ready'});
    })();
    </script>
</body>
</html>
