<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #202020;
            --fg: #cccccc;
            --fg-alt: #888888;
            --accent: #e0e0e0;
            --control-bg: rgba(30,30,30,0.92);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        .icon { font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons'; font-size: 14px; }

        #container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Background layer */
        #bgLayer { position: absolute; inset: 0; z-index: 0; }
        #bgLayer.checker {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        #bgLayer.checker.dark {
            background-color: #2a2a2a;
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
        }
        #bgLayer.white { background: #ffffff; }
        #bgLayer.black { background: #000000; }
        #bgLayer.default { background: var(--bg); }

        #pagCanvas { max-width: 100%; max-height: 100%; position: relative; z-index: 1; }

        /* Canvas wrapper for zoom + pan */
        #canvasWrap {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transform-origin: center center;
        }

        /* Zoom level indicator */
        #zoomInfo {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(80,80,80,0.9); color: #fff;
            padding: 4px 14px; border-radius: 5px;
            font-size: 18px; pointer-events: none;
            opacity: 0; z-index: 20; transition: opacity 0.2s;
        }

        /* Top-right toolbar */
        #topBar {
            position: absolute; top: 8px; right: 8px;
            display: flex; gap: 4px;
            z-index: 25; opacity: 1; transition: opacity 0.3s;
        }
        #topBar.hidden { opacity: 0; pointer-events: none; }
        #topBar .btn {
            width: 24px; height: 24px;
            background: transparent; border: none; color: var(--fg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; transition: background 0.1s;
        }
        #topBar .btn:hover { background: rgba(255,255,255,0.1); }
        #topBar .btn .icon { font-size: 12px; }

        /* Color picker popup */
        #colorPicker {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px; border-radius: 4px;
            display: none; z-index: 21;
            flex-direction: column; gap: 6px;
        }
        #colorPicker.show { display: flex; }
        #colorPicker input[type="color"] {
            width: 100%; height: 28px; border: none;
            cursor: pointer; background: transparent;
        }
        .colorSwatches { display: flex; gap: 4px; }
        .swatch {
            width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; border-radius: 2px;
        }
        .swatch:hover { border-color: var(--fg); }

        /* Control bar */
        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 32px; background: var(--control-bg);
            display: flex; align-items: center; padding: 0 8px;
            opacity: 1; transition: opacity 0.3s ease; z-index: 25;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .btn {
            background: transparent; border: none; color: var(--fg);
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
            position: relative;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn:active { background: rgba(255,255,255,0.15); }
        .btn.active { color: var(--accent); }
        .btn.pinned {
            background: rgba(255,255,255,0.18);
            color: var(--accent);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        /* Progress bar */
        #progressWrap {
            flex: 1; height: 10px; margin: 0 6px;
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }
        #progressBg {
            position: absolute; left: 10px; right: 10px;
            height: 1px; background: rgba(255,255,255,0.2);
            top: 50%; transform: translateY(-50%);
        }
        #progressFill {
            position: absolute; left: 10px; width: 0;
            height: 1px; background: var(--fg);
            top: 50%; transform: translateY(-50%);
        }
        #progressThumb {
            position: absolute; left: 10px;
            width: 10px; height: 10px;
            border: 1px solid var(--fg); border-radius: 50%;
            background: transparent;
            top: 50%; transform: translate(-50%, -50%);
            opacity: 0; transition: opacity 0.15s, background 0.15s; z-index: 2;
        }
        #progressWrap:hover #progressThumb { opacity: 1; }
        #progressWrap.dragging #progressThumb { opacity: 1; background: var(--fg); }
        #progressWrap:hover #progressFill { height: 2px; }
        #progressWrap:hover #progressBg { height: 2px; }
        #progressMarkers {
            position: absolute; left: 10px; right: 10px; top: 0; bottom: 0;
            pointer-events: none; z-index: 1;
        }
        .prog-marker {
            position: absolute; top: 50%; width: 5px; height: 5px;
            background: #ffca28; transform: translate(-50%, -50%) rotate(45deg);
            pointer-events: auto; cursor: pointer; opacity: 0.85;
            box-shadow: 0 0 3px rgba(0,0,0,0.8);
        }
        .prog-marker:hover { opacity: 1; transform: translate(-50%, -50%) rotate(45deg) scale(1.3); }

        /* Debug & render options popup */
        #optsMenu {
            position: absolute; top: 36px; right: 8px; width: 224px;
            background: var(--control-bg); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px; padding: 8px 10px; color: var(--fg); font-size: 11px;
            display: none; flex-direction: column; gap: 7px; z-index: 22;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        }
        #optsMenu.show { display: flex; }
        .opt-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .opt-row label { color: var(--fg-alt); font-size: 10px; white-space: nowrap; }
        .opt-pills { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
        .opt-pill {
            padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
            background: transparent; color: var(--fg-alt); font-size: 10px; cursor: pointer;
        }
        .opt-pill:hover { color: var(--fg); border-color: rgba(255,255,255,0.3); }
        .opt-pill.active { background: rgba(255,255,255,0.16); color: var(--accent); border-color: var(--accent); }
        .opt-chk { accent-color: var(--accent); cursor: pointer; }

        #time {
            color: var(--fg); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px; text-align: center;
            flex-shrink: 0; white-space: nowrap;
        }

        /* Volume slider */
        #volumeLayer {
            position: absolute; bottom: 32px; right: 8px;
            width: 130px; height: 32px;
            background: var(--control-bg);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s; z-index: 26;
        }
        #volumeLayer.show { opacity: 1; pointer-events: auto; }
        #volumeSlider {
            width: 110px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); outline: none;
            border-radius: 2px; cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: var(--fg); border-radius: 50%; cursor: pointer;
        }

        #status {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-alt); font-size: 13px; z-index: 1;
        }

        /* Toast notification */
        #toast {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%);
            background: rgba(80,80,80,0.95); color: #fff;
            padding: 6px 16px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
            opacity: 0; z-index: 30; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }

        /* Unified Info & Performance overlay (bottom-right, transparent panel, resizable from top-left) */
        #perfOverlay {
            position: absolute; bottom: 42px; right: 10px;
            width: 256px; min-width: 216px; max-width: 420px;
            min-height: 168px; max-height: calc(100% - 82px);
            background: rgba(16, 16, 16, 0.16);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px; padding: 8px 10px;
            color: #f4f4f4; font-size: 10px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.85);
            z-index: 18; display: none;
            flex-direction: column; overflow: hidden;
            transition: background 0.18s ease;
        }
        #perfOverlay:hover { background: rgba(16, 16, 16, 0.44); }
        #perfOverlay.show { display: flex; }
        #perfDot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #66bb6a; margin-right: 5px; vertical-align: middle;
            box-shadow: 0 0 4px rgba(102,187,106,0.7);
        }
        #btnCopyPerf {
            background: transparent; border: none; color: rgba(255,255,255,0.55);
            cursor: pointer; font-size: 10px; padding: 1px 3px; border-radius: 3px;
            font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons';
        }
        #btnCopyPerf:hover { color: #ffffff; background: rgba(255,255,255,0.12); }
        #perfResizeHandle {
            position: absolute; top: 0; left: 0;
            width: 12px; height: 12px; cursor: nwse-resize;
            z-index: 3; opacity: 0.45; transition: opacity 0.15s;
        }
        #perfResizeHandle::before {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 6px; height: 6px;
            border-top: 2px solid rgba(255,255,255,0.75);
            border-left: 2px solid rgba(255,255,255,0.75);
            border-top-left-radius: 1px;
        }
        #perfResizeL {
            position: absolute; top: 12px; left: 0; bottom: 0; width: 6px;
            cursor: ew-resize; z-index: 2;
        }
        #perfResizeT {
            position: absolute; top: 0; left: 12px; right: 28px; height: 6px;
            cursor: ns-resize; z-index: 2;
        }
        #perfOverlay:hover #perfResizeHandle { opacity: 1; }
        #perfHeader {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; cursor: grab; color: #d8d8d8;
            font-size: 10px; font-weight: 600; flex-shrink: 0;
            padding-left: 6px; gap: 6px;
        }
        #perfHeader:active { cursor: grabbing; }
        #perfDragGrip {
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: -1px; cursor: grab; transition: color 0.15s;
        }
        #perfHeader:hover #perfDragGrip { color: #ffffff; }
        #perfMetaGrid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 4px 8px; margin-bottom: 6px;
            padding: 2px 2px 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.18);
            flex-shrink: 0;
        }
        .pm-cell { display: flex; flex-direction: column; min-width: 0; }
        .pm-k { font-size: 9px; color: #cccccc; white-space: nowrap; }
        .pm-v { font-size: 11px; font-weight: 600; color: #ffffff; font-family: 'Consolas', 'Segoe UI', monospace; white-space: nowrap; }
        .pm-sub {
            grid-column: 1 / -1; display: flex; justify-content: space-between;
            font-size: 9px; color: #dcdcdc; padding-top: 2px;
        }
        #perfChart {
            width: 100%; flex: 1; min-height: 28px; display: block;
            background: transparent; border-radius: 2px;
            margin-bottom: 4px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }
        .perf-row {
            display: grid; grid-template-columns: 42px 1fr 1fr 1fr;
            gap: 2px; line-height: 1.45; flex-shrink: 0;
            font-family: 'Consolas', 'Segoe UI', monospace;
        }
        .perf-row .p-name { color: #d0d0d0; font-family: 'Segoe UI', sans-serif; }
        .perf-row .p-val { text-align: right; color: #ffffff; }

        /* File structure single panel (independent, sortable, resizable, inline edit) */
        #structPanel {
            position: absolute; top: 36px; right: 8px; bottom: 42px;
            width: 336px; min-width: 260px; max-width: 520px;
            background: var(--control-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: var(--fg); font-size: 11px;
            z-index: 21; display: none; flex-direction: column;
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        #structPanel.show { display: flex; }
        #structResizeL {
            position: absolute; top: 0; left: 0; bottom: 0; width: 6px;
            cursor: ew-resize; z-index: 3;
        }
        #structResizeL:hover { background: rgba(255,255,255,0.18); border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .struct-top {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0; font-weight: 600;
        }
        #structTitle { flex-shrink: 0; font-size: 12px; }
        #structSearch {
            flex: 1; min-width: 0; padding: 3px 8px;
            background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px; color: var(--fg); font-size: 11px; outline: none;
        }
        #structSearch:focus { border-color: var(--accent); }
        #btnStructClose {
            width: 20px; height: 20px; border: none; background: transparent;
            color: var(--fg-alt); cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            flex-shrink: 0;
        }
        #btnStructClose:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
        .struct-header {
            display: grid; grid-template-columns: 1fr 58px 54px 68px;
            gap: 6px; padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 10px; color: var(--fg-alt); flex-shrink: 0;
        }
        .struct-col {
            cursor: pointer; user-select: none; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .struct-col:hover { color: var(--fg); }
        .struct-col.num { text-align: right; }
        .struct-col.sorted { color: var(--accent); }
        .struct-body {
            flex: 1; overflow-y: auto; padding: 4px 6px;
        }
        .struct-body::-webkit-scrollbar { width: 4px; }
        .struct-body::-webkit-scrollbar-track { background: transparent; }
        .struct-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .p-row {
            display: grid; grid-template-columns: 1fr 58px 54px 68px;
            gap: 6px; align-items: center; min-height: 26px; padding: 3px 6px;
            border-radius: 5px; cursor: pointer; margin-bottom: 1px;
            transition: background 0.12s;
        }
        .p-row:hover { background: rgba(255,255,255,0.07); }
        .p-row.selected { background: rgba(255,255,255,0.16); color: #fff; }
        .p-name {
            display: flex; align-items: center; gap: 4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        .p-guide { color: rgba(255,255,255,0.22); font-size: 10px; flex-shrink: 0; }
        .p-name-txt { overflow: hidden; text-overflow: ellipsis; }
        .p-type {
            font-size: 9px; padding: 2px 5px; border-radius: 4px;
            background: rgba(255,255,255,0.08); color: #b8c4d0;
            text-align: center; white-space: nowrap; font-weight: 500;
        }
        .p-type.t-pre { background: rgba(118,185,237,0.14); color: #e0e0e0; }
        .p-type.t-img { background: rgba(78,201,176,0.14); color: #4ec9b0; }
        .p-type.t-txt { background: rgba(220,170,80,0.16); color: #e5b567; }
        .p-type.t-shp { background: rgba(160,174,192,0.14); color: #a0aec0; }
        .p-type.t-sld { background: rgba(180,142,173,0.15); color: #c792ea; }
        .p-type.t-nul { background: rgba(140,140,140,0.12); color: #999999; }
        .p-num {
            text-align: right; font-family: 'Consolas', monospace;
            font-size: 10px; color: var(--fg-alt); white-space: nowrap;
        }
        .p-inline-edit {
            padding: 6px 8px; margin: 2px 2px 4px 2px;
            background: rgba(0,0,0,0.25); border-radius: 5px;
            border-left: 2px solid var(--accent);
            display: flex; gap: 6px; align-items: center;
        }
        .p-inline-edit input[type="text"] {
            flex: 1; padding: 3px 6px; background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
            color: var(--fg); font-size: 11px; outline: none; min-width: 0;
        }
        .p-inline-edit input[type="text"]:focus { border-color: var(--accent); }
        .insp-btn {
            padding: 3px 8px; background: rgba(255,255,255,0.16);
            border: 1px solid var(--accent); border-radius: 4px;
            color: var(--accent); cursor: pointer; font-size: 10px; white-space: nowrap;
        }
        .insp-btn:hover { background: rgba(255,255,255,0.24); }
        .struct-footer {
            padding: 6px 10px; border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 10px; color: var(--fg-alt); flex-shrink: 0;
            display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
        }
        .sf-tag {
            padding: 1px 6px; border-radius: 3px;
            background: rgba(255,255,255,0.07); color: var(--fg);
            font-size: 10px; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="bgLayer" class="default"></div>
        <div id="canvasWrap">
            <canvas id="pagCanvas"></canvas>
        </div>
        <div id="zoomInfo"></div>
        <div id="toast"></div>

        <!-- Top-right toolbar -->
        <div id="topBar">
            <!-- \xE8FD = File Structure -->
            <button class="btn" id="btnStruct" title="文件结构 (F)">
                <span class="icon">&#xE8FD;</span>
            </button>
            <!-- \xE946 = Info & Performance -->
            <button class="btn" id="btnMeta" title="文件信息与性能监控 (L)">
                <span class="icon">&#xE946;</span>
            </button>
            <!-- \xE74B = Save -->
            <button class="btn" id="btnSave" title="保存为PNG">
                <span class="icon">&#xE74B;</span>
            </button>
            <!-- \xEF1F = BackgroundToggle -->
            <button class="btn" id="btnBg" title="切换背景">
                <span class="icon">&#xEF1F;</span>
            </button>
            <!-- \xE713 = Render & Debug Options -->
            <button class="btn" id="btnOpts" title="渲染与调试选项">
                <span class="icon">&#xE713;</span>
            </button>
        </div>
        <div id="optsMenu">
            <div class="opt-row"><label id="lblOptCache">位图缓存</label><input type="checkbox" id="chkCache" class="opt-chk" checked></div>
            <div class="opt-row"><label id="lblOptVideo">视频图层</label><input type="checkbox" id="chkVideo" class="opt-chk" checked></div>
            <div class="opt-row"><label id="lblOptCacheScale">缓存倍率</label><div class="opt-pills" id="grpCacheScale"><button class="opt-pill" data-val="0.5">0.5x</button><button class="opt-pill active" data-val="1">1.0x</button></div></div>
            <div class="opt-row"><label id="lblOptMaxFps">帧率上限</label><div class="opt-pills" id="grpMaxFps"><button class="opt-pill active" data-val="0" id="optUnlim">不限</button><button class="opt-pill" data-val="24">24</button><button class="opt-pill" data-val="30">30</button><button class="opt-pill" data-val="60">60</button></div></div>
            <div class="opt-row"><label id="lblOptSpeed">播放倍速</label><div class="opt-pills" id="grpSpeed"><button class="opt-pill" data-val="0.5">0.5x</button><button class="opt-pill active" data-val="1">1x</button><button class="opt-pill" data-val="1.5">1.5x</button><button class="opt-pill" data-val="2">2x</button></div></div>
            <div class="opt-row"><label id="lblOptScaleMode">填充模式</label><div class="opt-pills" id="grpScaleMode"><button class="opt-pill active" data-val="0" id="optSmNone">原始</button><button class="opt-pill" data-val="2" id="optSmFit">适应</button><button class="opt-pill" data-val="3" id="optSmZoom">裁剪</button><button class="opt-pill" data-val="1" id="optSmFill">拉伸</button></div></div>
            <div class="opt-row"><label id="lblOptStretch">时间伸缩</label><div class="opt-pills" id="grpStretch"><button class="opt-pill" data-val="0" id="optTsNone">不伸缩</button><button class="opt-pill" data-val="1" id="optTsScale">缩放</button><button class="opt-pill active" data-val="2" id="optTsRepeat">循环</button></div></div>
            <div class="opt-row"><button class="insp-btn" id="btnFreeCache" style="width:100%">释放缓存</button></div>
        </div>
        <div id="structPanel">
            <div id="structResizeL"></div>
            <div class="struct-top">
                <span id="structTitle">文件结构</span>
                <input type="text" id="structSearch" placeholder="搜索图层...">
                <button id="btnStructClose" title="关闭">&#x2715;</button>
            </div>
            <div class="struct-header" id="structHeader">
                <div class="struct-col" data-sort="name" id="colName">名称</div>
                <div class="struct-col" data-sort="type" id="colType">类型</div>
                <div class="struct-col num" data-sort="dur" id="colDur">时长</div>
                <div class="struct-col num" data-sort="size" id="colSize">尺寸 / 索引</div>
            </div>

        function setPerfVisible(show) {
            perfVisible = show;

        function clampPerfOverlay() {
            if (!perfOverlay || !perfVisible) return;
            var cw = document.documentElement.clientWidth;
            var ch = document.documentElement.clientHeight;
            var availH = Math.max(100, ch - SAFE_TOP - SAFE_BOTTOM);
            var rect = perfOverlay.getBoundingClientRect();
            if (rect.width === 0) return;
            var w = Math.max(MIN_PERF_W, Math.min(rect.width, Math.max(MIN_PERF_W, cw - SAFE_SIDE * 2)));
            var h = Math.min(Math.max(rect.height, MIN_PERF_H), availH);
            perfOverlay.style.width = w + 'px';
            if (perfOverlay.style.height) perfOverlay.style.height = h + 'px';
            if (perfOverlay.style.left && perfOverlay.style.left !== 'auto') {
                var curH = perfOverlay.getBoundingClientRect().height;
                var l = Math.max(SAFE_SIDE, Math.min(cw - w - SAFE_SIDE, parseFloat(perfOverlay.style.left) || rect.left));
                var t = Math.max(SAFE_TOP, Math.min(ch - curH - SAFE_BOTTOM, parseFloat(perfOverlay.style.top) || rect.top));
                perfOverlay.style.left = l + 'px';
                perfOverlay.style.top = t + 'px';
            } else {
                var curH2 = perfOverlay.getBoundingClientRect().height;
                var r = Math.max(SAFE_SIDE, Math.min(cw - w - SAFE_SIDE, parseFloat(perfOverlay.style.right) || 10));
                var b = Math.max(SAFE_BOTTOM, Math.min(ch - curH2 - SAFE_TOP, parseFloat(perfOverlay.style.bottom) || SAFE_BOTTOM));
                perfOverlay.style.right = r + 'px';
                perfOverlay.style.bottom = b + 'px';
            }
        }

        function startPerfResize(mode, e) {
            if (e.button !== 0) return;
            e.stopPropagation();
            e.preventDefault();
            var rect = perfOverlay.getBoundingClientRect();
            var cw = document.documentElement.clientWidth;
            var ch = document.documentElement.clientHeight;
            var safeBottomEdge = Math.min(rect.bottom, ch - SAFE_BOTTOM);
            perfOverlay.style.left = 'auto';
            perfOverlay.style.top = 'auto';
            perfOverlay.style.right = Math.max(SAFE_SIDE, cw - rect.right) + 'px';
            perfOverlay.style.bottom = Math.max(SAFE_BOTTOM, ch - safeBottomEdge) + 'px';
            perfResize.mode = mode;
            perfResize.startX = e.clientX;
            perfResize.startY = e.clientY;
            perfResize.origW = rect.width;
            perfResize.origH = rect.height;
            perfResize.rightX = rect.right;
            perfResize.bottomY = safeBottomEdge;

        function drawPerfChart() {
            if (!perfChart) return;
            var cw = perfChart.clientWidth || 232;
            var ch = perfChart.clientHeight || 48;
            if (perfChart.width !== cw) perfChart.width = cw;
            if (perfChart.height !== ch) perfChart.height = ch;
            var ctx = perfChart.getContext('2d');
            var w = perfChart.width, h = perfChart.height;
            ctx.clearRect(0, 0, w, h);

            var targetMs = 16.7;
            var maxFlush = 33;
            for (var i = 0; i < perfHistory.length; i++) {
                if (perfHistory[i].flush > maxFlush) maxFlush = perfHistory[i].flush;
            }
            // Reference budget line (16.7ms)
            var refY = Math.round(h - Math.min(h - 4, (targetMs / maxFlush) * (h - 4)));
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(0, refY);
            ctx.lineTo(w, refY);
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.font = '9px Consolas, monospace';
            ctx.fillText('16.7ms', 2, Math.max(9, refY - 2));

            if (perfHistory.length === 0) return;
            var barW = w / PERF_MAX_SAMPLES;
            var startX = w - perfHistory.length * barW;
            for (var j = 0; j < perfHistory.length; j++) {
                var item = perfHistory[j];
                var bh = Math.max(2, Math.min(h - 2, (item.flush / maxFlush) * (h - 4)));
                var c = item.flush <= 10 ? '#66bb6a' : (item.flush <= 20 ? '#ffca28' : '#ef5350');
                ctx.fillStyle = j === perfHoverIdx ? '#ffffff' : c;
                ctx.fillRect(startX + j * barW, h - bh, Math.max(1, barW - 1), bh);
            }
        }

                structResize.active = true;
                structResize.startX = e.clientX;
                structResize.origW = structPanel.getBoundingClientRect().width;
            });
            document.addEventListener('mousemove', function(e) {
                if (!structResize.active) return;
                var maxW = Math.min(520, document.documentElement.clientWidth - 20);
                var newW = Math.max(260, Math.min(maxW, structResize.origW + (structResize.startX - e.clientX)));
                structPanel.style.width = newW + 'px';
            });
            document.addEventListener('mouseup', function() { structResize.active = false; });
        }

        function getLayerRawType(layer) {
            return layer && typeof layer.layerType === 'function' ? layer.layerType() : 0;
        }

        function getLayerTypeName(layer) {
            if (!layer || typeof layer.layerType !== 'function') return T('LAYER_Unknown');
            var t = layer.layerType();
            var keys = ['LAYER_Unknown', 'LAYER_Null', 'LAYER_Solid', 'LAYER_Text', 'LAYER_Shape', 'LAYER_Image', 'LAYER_PreCompose', 'LAYER_Camera'];
            return keys[t] ? T(keys[t]) : (T('LAYER_Unknown') + '#' + t);
        }

        function safeVal(obj, fn) {
            try { return obj && typeof obj[fn] === 'function' ? obj[fn]() : null; }
            catch (e) { return null; }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function updateHeaderSortUI() {
            var cols = [
                { el: colName, k: 'name', label: T('COL_Name') },
                { el: colType, k: 'type', label: T('COL_Type') },
                { el: colDur, k: 'dur', label: T('COL_Duration') },
                { el: colSize, k: 'size', label: T('COL_SizeOrIdx') }
            ];
            cols.forEach(function(c) {
                if (!c.el) return;
                var isSorted = structSort.key === c.k && structSort.dir !== 0;
                c.el.classList.toggle('sorted', isSorted);
                c.el.textContent = c.label + (isSorted ? (structSort.dir > 0 ? ' ▲' : ' ▼') : '');
            });
        }

        document.querySelectorAll('.struct-col[data-sort]').forEach(function(col) {
            col.addEventListener('click', function(e) {
                e.stopPropagation();
                var k = col.dataset.sort;
                if (structSort.key !== k) { structSort.key = k; structSort.dir = 1; }
                else if (structSort.dir === 1) structSort.dir = -1;
                else { structSort.key = null; structSort.dir = 0; }
                refreshStructureTree();
            });
        });

        function collectLayers(comp, depth, out) {
            var n = safeVal(comp, 'numChildren') || 0;
            for (var i = 0; i < n; i++) {
                var layer = comp.getLayerAt(i);
                if (!layer) continue;
                var rawType = getLayerRawType(layer);
                var name = safeVal(layer, 'layerName') || T('INSP_Unnamed');
                var dur = safeVal(layer, 'duration') || 0;
                var st = safeVal(layer, 'startTime') || 0;
                var editableIdx = safeVal(layer, 'editableIndex');
                var b = safeVal(layer, 'getBounds');
                var bw = b ? Math.round((b.right || 0) - (b.left || 0)) : 0;
                var bh = b ? Math.round((b.bottom || 0) - (b.top || 0)) : 0;
                out.push({
                    id: out.length,
                    layer: layer,
                    depth: depth,
                    name: name,
                    rawType: rawType,
                    typeName: getLayerTypeName(layer),
                    dur: dur,
                    st: st,
                    editableIdx: editableIdx,
                    w: bw,
                    h: bh,
                    area: bw * bh
                });
                if (typeof layer.numChildren === 'function') collectLayers(layer, depth + 1, out);
            }
        }

        function getLayerTypeClass(rawType) {
            var map = { 1: 't-nul', 2: 't-sld', 3: 't-txt', 4: 't-shp', 5: 't-img', 6: 't-pre' };
            return map[rawType] || '';
        }

        function showLayerFooter(item) {
            if (!structFooter || !item) return;
            var alpha = safeVal(item.layer, 'alpha');
            var visible = safeVal(item.layer, 'visible');
            var tags = [];
            tags.push('<span class="sf-tag">' + escapeHtml(item.name) + '</span>');
            tags.push('<span class="sf-tag">' + escapeHtml(item.typeName) + '</span>');
            tags.push('<span class="sf-tag">' + (item.st / 1000000).toFixed(2) + 's~' + ((item.st + item.dur) / 1000000).toFixed(2) + 's</span>');
            if (item.w > 0 && item.h > 0) tags.push('<span class="sf-tag">' + item.w + '×' + item.h + '</span>');
            if (alpha != null) tags.push('<span class="sf-tag">α ' + alpha.toFixed(2) + '</span>');
            if (visible != null) tags.push('<span class="sf-tag">' + escapeHtml(T('INSP_Visible')) + ': ' + escapeHtml(visible ? T('BOOL_True') : T('BOOL_False')) + '</span>');
            if (item.editableIdx != null && item.editableIdx >= 0) tags.push('<span class="sf-tag">#' + item.editableIdx + '</span>');
            structFooter.innerHTML = tags.join('');
        }

        function refreshStructureTree() {
            updateHeaderSortUI();
            if (!structBody || !pagFile) return;
            layerNodeMap = [];
            collectLayers(pagFile, 0, layerNodeMap);

            var rows = layerNodeMap.slice();
            if (structFilter) {
                rows = rows.filter(function(r) {
                    return r.name.toLowerCase().indexOf(structFilter) >= 0 || r.typeName.toLowerCase().indexOf(structFilter) >= 0;
                });
            }
            var isSorted = (structSort.key && structSort.dir !== 0) || !!structFilter;
            if (structSort.key && structSort.dir !== 0) {
                var k = structSort.key, d = structSort.dir;
                rows.sort(function(a, b) {
                    if (k === 'name') return a.name.localeCompare(b.name) * d;
                    if (k === 'type') return a.typeName.localeCompare(b.typeName) * d;
                    if (k === 'dur') return (a.dur - b.dur) * d;
                    if (k === 'size') return (a.area - b.area) * d;
                    return 0;
                });
            }

            var html = '';
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                var indent = isSorted ? 0 : (r.depth * 12);
                var guide = (!isSorted && r.depth > 0) ? '<span class="p-guide">&#x2514;</span>' : '';
                var durStr = (r.dur / 1000000).toFixed(2) + 's';
                var sizeOrIdx = (r.w > 0 && r.h > 0) ? (r.w + '×' + r.h) : '-';
                if (r.editableIdx != null && r.editableIdx >= 0) sizeOrIdx = '#' + r.editableIdx + (r.w > 0 ? ' ' + r.w + '×' + r.h : '');
                var isSel = selectedLayer === r.layer;
                html += '<div class="p-row' + (isSel ? ' selected' : '') + '" data-row-id="' + r.id + '">'
                    + '<div class="p-name" style="padding-left:' + indent + 'px" title="' + escapeHtml(r.name) + '">' + guide + '<span class="p-name-txt">' + escapeHtml(r.name) + '</span></div>'
                    + '<div class="p-type ' + getLayerTypeClass(r.rawType) + '">' + escapeHtml(r.typeName) + '</div>'
                    + '<div class="p-num">' + durStr + '</div>'
                    + '<div class="p-num">' + escapeHtml(sizeOrIdx) + '</div>'
                    + '</div>';
                if (expandedEditId === r.id && r.editableIdx != null && r.editableIdx >= 0) {
                    if (r.rawType === 3) {
                        var td = null;
                        try { td = pagFile.getTextData(r.editableIdx); } catch (e) {}
                        var curText = td && td.text ? td.text : '';
                        html += '<div class="p-inline-edit"><input type="text" id="inspTextInput" value="' + escapeHtml(curText) + '">'
                            + '<button class="insp-btn" id="btnApplyText">' + T('INSP_ApplyText') + '</button></div>';
                    } else if (r.rawType === 5) {
                        html += '<div class="p-inline-edit"><input type="file" id="inspImgInput" accept="image/*" style="display:none">'
                            + '<button class="insp-btn" id="btnReplaceImg">' + T('INSP_ReplaceImage') + '</button></div>';
                    }
                }
            }
            structBody.innerHTML = html;

            structBody.querySelectorAll('.p-row').forEach(function(el) {
                var rid = parseInt(el.dataset.rowId, 10);
                var item = layerNodeMap[rid];
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedLayer = item ? item.layer : null;
                    showLayerFooter(item);
                    refreshStructureTree();
                });
                el.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    if (!item || item.editableIdx == null || item.editableIdx < 0) return;
                    selectedLayer = item.layer;
                    expandedEditId = expandedEditId === rid ? null : rid;
                    showLayerFooter(item);
                    refreshStructureTree();
                });
            });

            var curEditItem = expandedEditId != null ? layerNodeMap[expandedEditId] : null;
            var btnApplyText = document.getElementById('btnApplyText');
            if (btnApplyText && curEditItem) {
                btnApplyText.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var val = document.getElementById('inspTextInput').value;
                    try {
                        var td = pagFile.getTextData(curEditItem.editableIdx);
                        td.text = val;
                        pagFile.replaceText(curEditItem.editableIdx, td);
                        if (typeof pagView.flush === 'function') pagView.flush();
                        showToast(T('TOAST_TextUpdated'));
                    } catch (err) { log('replaceText failed: ' + err.message); }
                });
            }

            var btnReplaceImg = document.getElementById('btnReplaceImg');
            var inspImgInput = document.getElementById('inspImgInput');
            if (btnReplaceImg && inspImgInput && curEditItem) {
                btnReplaceImg.addEventListener('click', function(e) { e.stopPropagation(); inspImgInput.click(); });
                inspImgInput.addEventListener('change', function() {
                    var file = inspImgInput.files && inspImgInput.files[0];
                    if (!file) return;
                    var img = new Image();
                    img.onload = async function() {
                        try {
                            var pagImg = await pag.PAGImage.fromSource(img);
                            pagFile.replaceImage(curEditItem.editableIdx, pagImg);
                            if (typeof pagView.flush === 'function') pagView.flush();
                            showToast(T('TOAST_ImageUpdated'));
                        } catch (err) { log('replaceImage failed: ' + err.message); }
                    };
                    img.src = URL.createObjectURL(file);
                });
            }
        }

        function inspectCanvasPoint(e) {
            if (!pagView || typeof pagView.getLayersUnderPoint !== 'function') return;
            var rect = canvas.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            var x = (e.clientX - rect.left) * (canvas.width / rect.width);
            var y = (e.clientY - rect.top) * (canvas.height / rect.height);
            try {
                var layers = pagView.getLayersUnderPoint(x, y);
                if (layers && layers.length > 0) {
                    var topLayer = layers[0];
                    selectedLayer = topLayer;
                    var matched = layerNodeMap.find(function(x) { return x.layer === topLayer; });
                    if (matched) showLayerFooter(matched);
                    if (structVisible) refreshStructureTree();
                    else showToast((safeVal(topLayer, 'layerName') || T('INSP_Unnamed')) + ' (' + getLayerTypeName(topLayer) + ')');
                }
            } catch (err) {}
        }

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); showControls(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); showControls(); }
            else if (e.key === ' ') { e.preventDefault(); btnPlay.click(); showControls(); }
            else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleMetaPanel(); showControls(); }
            else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleStruct(); showControls(); }
        });

        // --- Render & Debug Options + Markers ---
        function renderPagMarkers() {
            if (!progressMarkers || !pagFile || duration <= 0) return;
            progressMarkers.innerHTML = '';
            var allMarkers = [];
            function collectMarkers(layer) {
                if (typeof layer.markers === 'function') {
                    try {
                        var ms = layer.markers();
                        if (ms && ms.length) {
                            for (var i = 0; i < ms.length; i++) allMarkers.push(ms[i]);
                        }
                    } catch (e) {}
                }
                if (typeof layer.numChildren === 'function') {
                    var n = layer.numChildren();
                    for (var j = 0; j < n; j++) collectMarkers(layer.getLayerAt(j));
                }
            }
            collectMarkers(pagFile);
            allMarkers.forEach(function(m) {
                var st = m.startTime || 0;
                var p = Math.max(0, Math.min(1, st / duration));
                var el = document.createElement('div');
                el.className = 'prog-marker';
                el.style.left = (p * 100).toFixed(2) + '%';
                el.title = (m.comment || 'Marker') + ' (' + (st / 1000000).toFixed(2) + 's)';
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (pagView) {
                        pagView.setProgress(p);
                        if (typeof pagView.flush === 'function') pagView.flush();
                        updateProgress(p);
                    }
                });
                progressMarkers.appendChild(el);
            });
        }

        function setPillGroup(id, val) {
            var grp = document.getElementById(id);
            if (!grp) return;
            grp.querySelectorAll('.opt-pill').forEach(function(b) {
                b.classList.toggle('active', b.dataset.val === String(val));
            });
        }

        function syncPagOptsUI() {
            if (!pagView || !pagFile) return;
            var chkC = document.getElementById('chkCache');
            var chkV = document.getElementById('chkVideo');
            if (chkC && typeof pagView.cacheEnabled === 'function') chkC.checked = pagView.cacheEnabled();
            if (chkV && typeof pagView.videoEnabled === 'function') chkV.checked = pagView.videoEnabled();
            if (typeof pagView.cacheScale === 'function') setPillGroup('grpCacheScale', pagView.cacheScale());
            if (typeof pagView.scaleMode === 'function') setPillGroup('grpScaleMode', pagView.scaleMode());
            if (typeof pagFile.timeStretchMode === 'function') setPillGroup('grpStretch', pagFile.timeStretchMode());
        }

        if (btnOpts) {
            btnOpts.addEventListener('click', function(e) {
                e.stopPropagation();
                colorPicker.classList.remove('show');
                optsMenu.classList.toggle('show');
                if (optsMenu.classList.contains('show')) syncPagOptsUI();
            });
        }
        var chkCache = document.getElementById('chkCache');
        if (chkCache) chkCache.addEventListener('change', function() {
            if (pagView && typeof pagView.setCacheEnabled === 'function') pagView.setCacheEnabled(chkCache.checked);
        });
        var chkVideo = document.getElementById('chkVideo');
        if (chkVideo) chkVideo.addEventListener('change', function() {
            if (pagView && typeof pagView.setVideoEnabled === 'function') pagView.setVideoEnabled(chkVideo.checked);
        });
        document.querySelectorAll('#grpCacheScale .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var v = parseFloat(b.dataset.val);
                if (pagView && typeof pagView.setCacheScale === 'function') pagView.setCacheScale(v);
                setPillGroup('grpCacheScale', v);
            });
        });
        document.querySelectorAll('#grpMaxFps .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var v = parseInt(b.dataset.val, 10);
                if (pagView && typeof pagView.setMaxFrameRate === 'function') pagView.setMaxFrameRate(v > 0 ? v : 60);
                setPillGroup('grpMaxFps', v);
            });
        });
        document.querySelectorAll('#grpSpeed .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var spd = parseFloat(b.dataset.val);
                if (pagFile && origDuration > 0 && typeof pagFile.setDuration === 'function') {
                    duration = Math.round(origDuration / spd);
                    pagFile.setDuration(duration);
                    if (pagView && typeof pagView.flush === 'function') pagView.flush();
                }
                setPillGroup('grpSpeed', spd);
            });
        });
        document.querySelectorAll('#grpScaleMode .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var m = parseInt(b.dataset.val, 10);
                if (pagView && typeof pagView.setScaleMode === 'function') {
                    var wrap = document.getElementById('canvasWrap');
                    var dpr = window.devicePixelRatio || 1;
                    if (m === 0) {
                        canvas.style.width = '';
                        canvas.style.height = '';
                        canvas.width = pagWidth;
                        canvas.height = pagHeight;
                    } else if (wrap) {
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        canvas.width = Math.max(1, Math.round(wrap.clientWidth * dpr));
                        canvas.height = Math.max(1, Math.round(wrap.clientHeight * dpr));
                    }
                    if (typeof pagView.updateSize === 'function') pagView.updateSize();
                    pagView.setScaleMode(m);
                    if (typeof pagView.flush === 'function') pagView.flush();
                }
                setPillGroup('grpScaleMode', m);
            });
        });
        document.querySelectorAll('#grpStretch .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var m = parseInt(b.dataset.val, 10);
                if (pagFile && typeof pagFile.setTimeStretchMode === 'function') {
                    pagFile.setTimeStretchMode(m);
                    if (pagMeta) { pagMeta.timeStretchMode = m; updateMetaPanel(); }
                }
                setPillGroup('grpStretch', m);
            });
        });
        var btnFreeCache = document.getElementById('btnFreeCache');
        if (btnFreeCache) btnFreeCache.addEventListener('click', function(e) {
            e.stopPropagation();
            if (pagView && typeof pagView.freeCache === 'function') {
                pagView.freeCache();
                showToast(T('TOAST_CacheFreed'));
            }
        });

        // --- Messages from C# ---
        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'loadFile') { fileSize = msg.fileSize || 0; loadFile(msg.base64, msg.libpagSrc, msg.wasmSrc); }
        });

        log('Page ready');
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage({type:'ready'});
    })();
    </script>
</body>
</html>
