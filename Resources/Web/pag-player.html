<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #202020;
            --fg: #cccccc;
            --fg-alt: #888888;
            --accent: #76b9ed;
            --control-bg: rgba(30,30,30,0.92);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        .icon { font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons'; font-size: 14px; }

        #container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Background layer */
        #bgLayer { position: absolute; inset: 0; z-index: 0; }
        #bgLayer.checker {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        #bgLayer.checker.dark {
            background-color: #2a2a2a;
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
        }
        #bgLayer.white { background: #ffffff; }
        #bgLayer.black { background: #000000; }
        #bgLayer.default { background: var(--bg); }

        #pagCanvas { max-width: 100%; max-height: 100%; position: relative; z-index: 1; }

        /* Canvas wrapper for zoom + pan */
        #canvasWrap {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transform-origin: center center;
        }

        /* Zoom level indicator */
        #zoomInfo {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(80,80,80,0.9); color: #fff;
            padding: 4px 14px; border-radius: 5px;
            font-size: 18px; pointer-events: none;
            opacity: 0; z-index: 20; transition: opacity 0.2s;
        }

        /* Top-right toolbar */
        #topBar {
            position: absolute; top: 8px; right: 8px;
            display: flex; gap: 4px;
            z-index: 20; opacity: 1; transition: opacity 0.3s;
        }
        #topBar.hidden { opacity: 0; pointer-events: none; }
        #topBar .btn {
            width: 24px; height: 24px;
            background: transparent; border: none; color: var(--fg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; transition: background 0.1s;
        }
        #topBar .btn:hover { background: rgba(255,255,255,0.1); }
        #topBar .btn .icon { font-size: 12px; }

        /* Metadata panel (like LottieFilesViewer textMeta) */
        #metaPanel {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px 12px; border-radius: 4px;
            color: var(--fg); font-size: 11px;
            line-height: 1.8; z-index: 21;
            display: none; white-space: nowrap;
        }
        #metaPanel.show { display: block; }
        #metaPanel .label { color: var(--fg-alt); }

        /* Color picker popup */
        #colorPicker {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px; border-radius: 4px;
            display: none; z-index: 21;
            flex-direction: column; gap: 6px;
        }
        #colorPicker.show { display: flex; }
        #colorPicker input[type="color"] {
            width: 100%; height: 28px; border: none;
            cursor: pointer; background: transparent;
        }
        .colorSwatches { display: flex; gap: 4px; }
        .swatch {
            width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; border-radius: 2px;
        }
        .swatch:hover { border-color: var(--fg); }

        /* Control bar */
        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 32px; background: var(--control-bg);
            display: flex; align-items: center; padding: 0 8px;
            opacity: 1; transition: opacity 0.3s ease; z-index: 10;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .btn {
            background: transparent; border: none; color: var(--fg);
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 2px; transition: background 0.1s; flex-shrink: 0;
        }
        .btn:hover { background: rgba(255,255,255,0.08); }
        .btn:active { background: rgba(255,255,255,0.12); }
        .btn.active { color: var(--accent); }

        /* Progress bar */
        #progressWrap {
            flex: 1; height: 10px; margin: 0 6px;
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }
        #progressBg {
            position: absolute; left: 10px; right: 10px;
            height: 1px; background: rgba(255,255,255,0.2);
            top: 50%; transform: translateY(-50%);
        }
        #progressFill {
            position: absolute; left: 10px; width: 0;
            height: 1px; background: var(--fg);
            top: 50%; transform: translateY(-50%);
        }
        #progressThumb {
            position: absolute; left: 10px;
            width: 10px; height: 10px;
            border: 1px solid var(--fg); border-radius: 50%;
            background: transparent;
            top: 50%; transform: translate(-50%, -50%);
            opacity: 0; transition: opacity 0.15s, background 0.15s; z-index: 2;
        }
        #progressWrap:hover #progressThumb { opacity: 1; }
        #progressWrap.dragging #progressThumb { opacity: 1; background: var(--fg); }
        #progressWrap:hover #progressFill { height: 2px; }
        #progressWrap:hover #progressBg { height: 2px; }

        #time {
            color: var(--fg); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px; text-align: center;
            flex-shrink: 0; white-space: nowrap;
        }

        /* Volume slider */
        #volumeLayer {
            position: absolute; bottom: 32px; right: 8px;
            width: 130px; height: 32px;
            background: var(--control-bg);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s; z-index: 11;
        }
        #volumeLayer.show { opacity: 1; pointer-events: auto; }
        #volumeSlider {
            width: 110px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); outline: none;
            border-radius: 2px; cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: var(--fg); border-radius: 50%; cursor: pointer;
        }

        #status {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-alt); font-size: 13px; z-index: 1;
        }

        #info {
            position: absolute; top: 8px; left: 8px;
            color: var(--fg-alt); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none; opacity: 0;
            transition: opacity 0.3s; z-index: 2;
        }
        #info.show { opacity: 1; }

        /* Toast notification */
        #toast {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%);
            background: rgba(80,80,80,0.95); color: #fff;
            padding: 6px 16px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
            opacity: 0; z-index: 30; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }

        /* Performance OSD overlay */
        #perfOverlay {
            position: absolute; bottom: 44px; left: 8px;
            z-index: 15; cursor: move;
            opacity: 1; transition: opacity 0.3s;
            pointer-events: auto;
        }
        #perfOverlay.hidden { opacity: 0; pointer-events: none; }
        #perfOverlay canvas {
            display: block;
            background: rgba(0,0,0,0.6);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="bgLayer" class="default"></div>
        <div id="canvasWrap">
            <canvas id="pagCanvas"></canvas>
        </div>
        <div id="zoomInfo"></div>
        <div id="info"></div>
        <div id="toast"></div>

        <!-- Performance OSD overlay -->
        <div id="perfOverlay">
            <canvas id="perfCanvas" width="120" height="30"></canvas>
        </div>

        <!-- Top-right toolbar -->
        <div id="topBar">
            <!-- \xE792 = Info -->
            <button class="btn" id="btnMeta" title="文件信息">
                <span class="icon">&#xE946;</span>
            </button>
            <!-- \xE74B = Save -->
            <button class="btn" id="btnSave" title="保存为PNG">
                <span class="icon">&#xE74B;</span>
            </button>
            <!-- \xEF1F = BackgroundToggle -->
            <button class="btn" id="btnBg" title="切换背景">
                <span class="icon">&#xEF1F;</span>
            </button>
            <!-- \xE9F9 = Performance -->
            <button class="btn active" id="btnPerf" title="性能监控">
                <span class="icon">&#xE9F9;</span>
            </button>
        </div>
        <div id="metaPanel"></div>
        <div id="colorPicker">
            <div class="colorSwatches">
                <div class="swatch" data-bg="default" style="background:var(--bg)" title="默认"></div>
                <div class="swatch" data-bg="checker" style="background:repeating-conic-gradient(#e0e0e0 0% 25%, #fff 0% 50%) 50%/8px 8px" title="棋盘格"></div>
                <div class="swatch" data-bg="white" style="background:#fff" title="白色"></div>
                <div class="swatch" data-bg="black" style="background:#000" title="黑色"></div>
            </div>
            <input type="color" id="customColor" value="#202020" title="自定义颜色">
        </div>

        <div id="controls">
            <button class="btn" id="btnPlayPause" title="播放 / 暂停">
                <span class="icon">&#xE768;</span>
            </button>
            <button class="btn active" id="btnLoop" title="循环">
                <span class="icon">&#xE777;</span>
            </button>
            <div id="progressWrap">
                <div id="progressBg"></div>
                <div id="progressFill"></div>
                <div id="progressThumb"></div>
            </div>
            <span id="time">00:00 / 00:00</span>
            <button class="btn" id="btnMute" title="音量">
                <span class="icon" id="volumeIcon">&#xE767;</span>
            </button>
        </div>
        <div id="volumeLayer">
            <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1">
        </div>
        <div id="status">加载中...</div>
    </div>

    <script>
    (function() {
        // --- i18n: read from C# Translations.config ---
        // Default translations (fallback before C# sends config)
        var _defaultT = {
            'BTN_PlayPause': {zh:'播放 / 暂停',en:'Play / Pause'},
            'BTN_Loop': {zh:'循环',en:'Loop'},
            'BTN_Volume': {zh:'音量',en:'Volume'},
            'BTN_Meta': {zh:'文件信息',en:'Info'},
            'BTN_Save': {zh:'保存为PNG',en:'Save as PNG'},
            'BTN_Background': {zh:'切换背景',en:'Background'},
            'BG_Default': {zh:'默认',en:'Default'},
            'BG_Checker': {zh:'棋盘格',en:'Checkerboard'},
            'BG_White': {zh:'白色',en:'White'},
            'BG_Black': {zh:'黑色',en:'Black'},
            'BG_Custom': {zh:'自定义颜色',en:'Custom color'},
            'STATUS_Loading': {zh:'加载中...',en:'Loading...'},
            'STATUS_InitLibpag': {zh:'加载 libpag...',en:'Loading libpag...'},
            'STATUS_InitPAG': {zh:'初始化...',en:'Initializing...'},
            'STATUS_Decoding': {zh:'解码中...',en:'Decoding...'},
            'STATUS_InvalidFile': {zh:'无效的PAG文件',en:'Invalid PAG file'},
            'STATUS_CreateView': {zh:'创建视图...',en:'Creating view...'},
            'STATUS_Error': {zh:'错误',en:'Error'},
            'TOAST_Saved': {zh:'已保存',en:'Saved'},
            'TOAST_Copied': {zh:'已复制',en:'Copied'},
            'TOAST_SaveFailed': {zh:'保存失败',en:'Save failed'},
            'TOAST_CopyFailed': {zh:'复制失败',en:'Copy failed'},
            'META_Width': {zh:'宽度',en:'Width'},
            'META_Height': {zh:'高度',en:'Height'},
            'META_Duration': {zh:'时长',en:'Duration'},
            'META_FPS': {zh:'帧率',en:'FPS'},
            'META_Layers': {zh:'图层',en:'Layers'},
            'META_Images': {zh:'图片',en:'Images'},
            'META_Texts': {zh:'文本',en:'Texts'}
        };
        var lang = (navigator.language || 'zh').startsWith('zh') ? 'zh' : 'en';
        var _t = _defaultT;
        function T(key) { var v = _t[key]; return v ? (v[lang] || v.zh || '') : key; }

        var statusEl = document.getElementById('status');
        var canvas = document.getElementById('pagCanvas');
        var bgLayer = document.getElementById('bgLayer');
        var controls = document.getElementById('controls');
        var topBar = document.getElementById('topBar');
        var btnPlay = document.getElementById('btnPlayPause');
        var btnLoop = document.getElementById('btnLoop');
        var btnMute = document.getElementById('btnMute');
        var btnBg = document.getElementById('btnBg');
        var btnMeta = document.getElementById('btnMeta');
        var btnSave = document.getElementById('btnSave');
        var btnPerf = document.getElementById('btnPerf');
        var metaPanel = document.getElementById('metaPanel');
        var colorPicker = document.getElementById('colorPicker');
        var customColor = document.getElementById('customColor');
        var volumeIcon = document.getElementById('volumeIcon');
        var volumeLayer = document.getElementById('volumeLayer');
        var volumeSlider = document.getElementById('volumeSlider');
        var progressWrap = document.getElementById('progressWrap');
        var progressFill = document.getElementById('progressFill');
        var progressThumb = document.getElementById('progressThumb');
        var timeEl = document.getElementById('time');
        var infoEl = document.getElementById('info');
        var toastEl = document.getElementById('toast');

        var pag = null, pagFile = null, pagView = null;
        var isPlaying = false, isLooping = true, isDragging = false;
        var duration = 0, pagWidth = 0, pagHeight = 0;
        var hideTimer = null;

        // Apply i18n to UI elements
        window.applyI18n = function() {
            lang = window.__lang || lang;
            _t = Object.assign({}, _defaultT, window.__translations || {});
            btnPlay.title = T('BTN_PlayPause');
            btnLoop.title = T('BTN_Loop');
            btnMute.title = T('BTN_Volume');
            btnMeta.title = T('BTN_Meta');
            btnSave.title = T('BTN_Save');
            btnBg.title = T('BTN_Background');
            btnPerf.title = T('BTN_Perf');
            document.querySelector('.swatch[data-bg="default"]').title = T('BG_Default');
            document.querySelector('.swatch[data-bg="checker"]').title = T('BG_Checker');
            document.querySelector('.swatch[data-bg="white"]').title = T('BG_White');
            document.querySelector('.swatch[data-bg="black"]').title = T('BG_Black');
            customColor.title = T('BG_Custom');
            statusEl.textContent = T('STATUS_Loading');
        };
        applyI18n();
        var volume = 1.0;
        var isMuted = false;
        var pagMeta = null;

        var ICON_PLAY = '\uE768';
        var ICON_PAUSE = '\uE769';
        var ICON_LOOP_OFF = '\uE8D8';
        var ICON_LOOP_ON = '\uE777';
        var ICON_VOL3 = '\uE767';
        var ICON_VOL2 = '\uE994';
        var ICON_VOL1 = '\uE993';
        var ICON_VOL0 = '\uE74F';

        // --- Performance overlay ---
        var perfOverlay = document.getElementById('perfOverlay');
        var perfCanvas = document.getElementById('perfCanvas');
        var fpsHistory = [];
        var flushHistory = [];
        var perfVisible = localStorage.getItem('pag-perf-visible') !== '0';
        var perfDrag = { active: false, startX: 0, startY: 0, origX: 0, origY: 0 };

        // Restore position
        var savedPerfPos = localStorage.getItem('pag-perf-pos');
        if (savedPerfPos) {
            try {
                var pos = JSON.parse(savedPerfPos);
                if (pos.left) { perfOverlay.style.left = pos.left; perfOverlay.style.bottom = 'auto'; }
                if (pos.top) perfOverlay.style.top = pos.top;
            } catch(e) {}
        }

        function drawPerfGraph() {
            var ctx = perfCanvas.getContext('2d');
            var W = 120, H = 30;
            ctx.clearRect(0, 0, W, H);

            var currentFps = fpsHistory.length > 0 ? fpsHistory[fpsHistory.length - 1] : 0;
            var currentMs = flushHistory.length > 0 ? flushHistory[flushHistory.length - 1] : 0;

            // 刻度线（虚线）
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.setLineDash([1, 1]);
            ctx.lineWidth = 0.5;
            // 60fps 线（顶部）
            ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(W, 0); ctx.stroke();
            // 30fps 线（中间）
            ctx.beginPath(); ctx.moveTo(30, 15); ctx.lineTo(W, 15); ctx.stroke();
            ctx.setLineDash([]);

            // 第一行：FPS
            var fpsColor = currentFps >= 50 ? '#4CAF50' : (currentFps >= 30 ? '#FFC107' : '#F44336');
            ctx.fillStyle = fpsColor;
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(String(currentFps), 2, 11);

            // 分隔符
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText('|', 22, 11);

            // FPS 迷你图
            drawSparkline(ctx, fpsHistory, 60, 30, 90, fpsColor, 0);

            // 第二行：MS
            var msColor = '#2196F3';
            ctx.fillStyle = msColor;
            ctx.font = 'bold 10px monospace';
            ctx.fillText(String(Math.round(currentMs)), 2, 24);

            // 分隔符
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillText('|', 22, 24);

            // MS 迷你图
            drawSparkline(ctx, flushHistory, 33, 30, 90, msColor, 15);
        }

        function drawSparkline(ctx, data, maxVal, points, graphWidth, color, yOffset) {
            if (data.length < 2) return;
            var recent = data.slice(-points);
            var step = graphWidth / points;
            var graphH = 12;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (var i = 0; i < recent.length; i++) {
                var x = 30 + i * step;
                var y = yOffset + graphH - (recent[i] / maxVal) * graphH;
                y = Math.max(yOffset, Math.min(yOffset + graphH, y));
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.strokeStyle = color;
            ctx.stroke();
        }

        // Perf toggle
        if (!perfVisible) { perfOverlay.classList.add('hidden'); }
        else { btnPerf.classList.add('active'); }

        btnPerf.addEventListener('click', function() {
            perfVisible = !perfVisible;
            perfOverlay.classList.toggle('hidden', !perfVisible);
            btnPerf.classList.toggle('active', perfVisible);
            localStorage.setItem('pag-perf-visible', perfVisible ? '1' : '0');
            if (perfVisible) drawPerfGraph();
        });

        // Perf drag
        perfOverlay.addEventListener('mousedown', function(e) {
            perfDrag.active = true;
            perfDrag.startX = e.clientX;
            perfDrag.startY = e.clientY;
            var rect = perfOverlay.getBoundingClientRect();
            perfDrag.origX = rect.left;
            perfDrag.origY = rect.top;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!perfDrag.active) return;
            var dx = e.clientX - perfDrag.startX;
            var dy = e.clientY - perfDrag.startY;
            perfOverlay.style.left = (perfDrag.origX + dx) + 'px';
            perfOverlay.style.top = (perfDrag.origY + dy) + 'px';
            perfOverlay.style.bottom = 'auto';
        });
        document.addEventListener('mouseup', function() {
            if (perfDrag.active) {
                perfDrag.active = false;
                localStorage.setItem('pag-perf-pos', JSON.stringify({
                    left: perfOverlay.style.left,
                    top: perfOverlay.style.top
                }));
            }
        });

        // --- Toast ---
        var toastTimer = null;
        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { toastEl.classList.remove('show'); }, 1500);
        }

        // --- Metadata panel (like LottieFilesViewer textMeta) ---
        function updateMetaPanel() {
            if (!pagMeta) return;
            var fps = pagMeta.fps || 30;
            var dur = (duration / 1000000).toFixed(2);
            metaPanel.innerHTML =
                '<span class="label">' + T('META_Width') + ': </span>' + pagWidth + 'px<br>' +
                '<span class="label">' + T('META_Height') + ': </span>' + pagHeight + 'px<br>' +
                '<span class="label">' + T('META_Duration') + ': </span>' + dur + 's<br>' +
                '<span class="label">' + T('META_FPS') + ': </span>' + fps + '<br>' +
                '<span class="label">' + T('META_Layers') + ': </span>' + (pagMeta.numLayers || '-') + '<br>' +
                '<span class="label">' + T('META_Images') + ': </span>' + (pagMeta.numImages || '-') + '<br>' +
                '<span class="label">' + T('META_Texts') + ': </span>' + (pagMeta.numTexts || '-');
        }

        btnMeta.addEventListener('mouseenter', function() {
            updateMetaPanel();
            metaPanel.classList.add('show');
        });
        btnMeta.addEventListener('mouseleave', function() {
            metaPanel.classList.remove('show');
        });

        // --- Capture current frame with transparent background ---
        function captureCanvas() {
            if (!pagView || !pagFile) return null;
            if (typeof pagView.flush === 'function') pagView.flush();

            var tmp = document.createElement('canvas');
            tmp.width = canvas.width;
            tmp.height = canvas.height;
            var ctx = tmp.getContext('2d');
            ctx.drawImage(canvas, 0, 0);

            // Remove black background
            var imageData = ctx.getImageData(0, 0, tmp.width, tmp.height);
            var data = imageData.data;
            for (var i = 0; i < data.length; i += 4) {
                if (data[i] < 10 && data[i+1] < 10 && data[i+2] < 10) {
                    data[i+3] = 0;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            return tmp;
        }

        function captureAsBase64() {
            var tmp = captureCanvas();
            if (!tmp) return null;
            var dataUrl = tmp.toDataURL('image/png');
            return dataUrl.split(',')[1]; // Remove data:image/png;base64, prefix
        }

        // --- Save image (save next to PAG file) ---
        btnSave.addEventListener('click', function() {
            var base64 = captureAsBase64();
            if (!base64) { showToast(T('TOAST_SaveFailed')); return; }
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage({type: 'saveImage', data: base64});
                showToast(T('TOAST_Saved'));
            }
        });

        // --- Copy to clipboard (Ctrl+C) ---
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'c') {
                e.preventDefault();
                var base64 = captureAsBase64();
                if (!base64) return;
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage({type: 'copyImage', data: base64});
                    showToast(T('TOAST_Copied'));
                }
            }
        });

        // --- Background switcher ---
        var BG_MODES = ['default', 'checker', 'white', 'black'];
        var bgIndex = parseInt(localStorage.getItem('pag-bg-index') || '0');
        var customBgColor = localStorage.getItem('pag-bg-custom') || '#202020';

        function applyBg() {
            var mode = BG_MODES[bgIndex];
            bgLayer.className = mode;
            if (mode === 'checker') {
                var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
                if (bg === '#202020' || bg === '#1a1a1a') bgLayer.classList.add('dark');
            }
            bgLayer.style.background = (mode === 'default' || mode === 'checker') ? '' : mode;
            customColor.value = customBgColor;
            localStorage.setItem('pag-bg-index', bgIndex);
        }

        function cycleBg() { bgIndex = (bgIndex + 1) % BG_MODES.length; applyBg(); }

        document.querySelectorAll('.swatch').forEach(function(el) {
            el.addEventListener('click', function() {
                bgIndex = BG_MODES.indexOf(el.dataset.bg);
                applyBg(); colorPicker.classList.remove('show');
            });
        });

        customColor.addEventListener('input', function() {
            customBgColor = customColor.value;
            bgLayer.className = ''; bgLayer.style.background = customBgColor;
            localStorage.setItem('pag-bg-custom', customBgColor);
            bgIndex = -1; localStorage.setItem('pag-bg-index', '-1');
        });

        btnBg.addEventListener('click', function() { cycleBg(); });
        btnBg.addEventListener('contextmenu', function(e) {
            e.preventDefault(); colorPicker.classList.toggle('show');
        });
        document.addEventListener('click', function(e) {
            if (!colorPicker.contains(e.target) && e.target !== btnBg && !btnBg.contains(e.target))
                colorPicker.classList.remove('show');
            if (!metaPanel.contains(e.target) && e.target !== btnMeta && !btnMeta.contains(e.target))
                metaPanel.classList.remove('show');
        });

        if (bgIndex < 0) { bgLayer.className = ''; bgLayer.style.background = customBgColor; }
        else applyBg();

        // --- Auto-hide ---
        function showControls() {
            controls.classList.remove('hidden');
            topBar.classList.remove('hidden');
            infoEl.classList.add('show');
            if (perfVisible) perfOverlay.classList.remove('hidden');
            resetHideTimer();
        }
        function hideControls() {
            if (isDragging || perfDrag.active) return;
            controls.classList.add('hidden');
            topBar.classList.add('hidden');
            infoEl.classList.remove('show');
            volumeLayer.classList.remove('show');
            colorPicker.classList.remove('show');
            metaPanel.classList.remove('show');
            perfOverlay.classList.add('hidden');
        }
        function resetHideTimer() {
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(hideControls, 1500);
        }
        document.addEventListener('mousemove', showControls);
        document.addEventListener('mousedown', showControls);

        // --- Time ---
        function fmt(us) {
            var s = us / 1000000;
            var m = Math.floor(s / 60);
            var sec = Math.floor(s % 60);
            return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
        }

        function log(msg) {
            console.log('[PAG] ' + msg);
            if (window.chrome && window.chrome.webview)
                window.chrome.webview.postMessage({type:'log', message:msg});
        }

        // --- Volume ---
        function updateVolumeIcon() {
            var v = isMuted ? 0 : volume;
            if (v < 0.01) volumeIcon.textContent = ICON_VOL0;
            else if (v < 0.34) volumeIcon.textContent = ICON_VOL1;
            else if (v < 0.67) volumeIcon.textContent = ICON_VOL2;
            else volumeIcon.textContent = ICON_VOL3;
        }

        function applyVolume() {
            var v = isMuted ? 0 : volume;
            volumeSlider.value = Math.round(v * 100);
            if (pagView && typeof pagView.setVolume === 'function') pagView.setVolume(v);
            updateVolumeIcon();
        }

        btnMute.addEventListener('click', function() { isMuted = !isMuted; applyVolume(); });
        volumeSlider.addEventListener('input', function() { volume = volumeSlider.value / 100; isMuted = false; applyVolume(); });

        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();
                var delta = e.deltaY > 0 ? -0.1 : 0.1;
                zoomLevel = Math.max(0.1, Math.min(5.0, zoomLevel + delta));
                applyTransform(); showZoomInfo(); showControls();
            } else {
                if (e.deltaY < 0) volume = Math.min(1, volume + 0.04);
                else volume = Math.max(0, volume - 0.04);
                isMuted = false; applyVolume(); showControls();
                volumeLayer.classList.add('show');
                clearTimeout(hideTimer);
                hideTimer = setTimeout(function() { volumeLayer.classList.remove('show'); }, 1500);
            }
        }, { passive: false });

        // --- Canvas zoom + pan ---
        var canvasWrap = document.getElementById('canvasWrap');
        var zoomInfoEl = document.getElementById('zoomInfo');
        var zoomLevel = 1.0;
        var zoomHideTimer = null;
        var panX = 0, panY = 0;
        var isPanning = false;
        var panStartX = 0, panStartY = 0;

        function applyTransform() {
            canvasWrap.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + zoomLevel + ')';
        }

        function showZoomInfo() {
            zoomInfoEl.textContent = Math.round(zoomLevel * 100) + '%';
            zoomInfoEl.style.opacity = '0.9';
            if (zoomHideTimer) clearTimeout(zoomHideTimer);
            zoomHideTimer = setTimeout(function() { zoomInfoEl.style.opacity = '0'; }, 600);
        }

        function resetView() {
            zoomLevel = 1.0; panX = 0; panY = 0;
            applyTransform(); showZoomInfo();
        }

        canvasWrap.addEventListener('dblclick', resetView);

        canvas.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
                isPanning = true;
                panStartX = e.clientX - panX;
                panStartY = e.clientY - panY;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });
        document.addEventListener('mousemove', function(e) {
            if (isPanning) {
                panX = e.clientX - panStartX;
                panY = e.clientY - panStartY;
                applyTransform();
            }
        });
        document.addEventListener('mouseup', function() {
            if (isPanning) { isPanning = false; canvas.style.cursor = ''; }
        });

        // --- Window drag (click on background area) ---
        bgLayer.addEventListener('mousedown', function(e) {
            if (e.button === 0) {
                e.preventDefault();
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type: 'startDrag'});
            }
        });

        // --- Load PAG ---
        async function loadFile(base64, libpagSrc, wasmSrc) {
            try {
                statusEl.textContent = T('STATUS_InitLibpag');
                if (!pag) {
                    var s = document.createElement('script');
                    s.src = libpagSrc;
                    document.head.appendChild(s);
                    await new Promise(function(ok, fail) { s.onload=ok; s.onerror=function(){fail(new Error('load libpag.js failed'))}; });
                    statusEl.textContent = T('STATUS_InitPAG');
                    pag = await window.libpag.PAGInit({locateFile:function(){return wasmSrc}});
                    log('PAG initialized');
                }
                if (pagView) { try{pagView.destroy();}catch(e){} pagView=null; }
                if (pagFile) { try{pagFile.destroy();}catch(e){} pagFile=null; }

                statusEl.textContent = T('STATUS_Decoding');
                var raw = atob(base64);
                var buf = new Uint8Array(raw.length);
                for (var i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i);
                var ab = buf.buffer.slice(buf.byteOffset, buf.byteOffset+buf.byteLength);
                pagFile = await pag.PAGFile.load(ab);
                if (!pagFile) { statusEl.textContent=T('STATUS_InvalidFile'); return; }

                duration = pagFile.duration();
                pagWidth = pagFile.width();
                pagHeight = pagFile.height();
                infoEl.textContent = pagWidth + '\u00d7' + pagHeight;
                canvas.width = pagWidth; canvas.height = pagHeight;

                // Collect metadata
                var fileProps = Object.getOwnPropertyNames(Object.getPrototypeOf(pagFile)).filter(function(k) { return typeof pagFile[k] === 'function'; });
                log('PAGFile methods: ' + fileProps.join(', '));
                
                pagMeta = {
                    fps: typeof pagFile.frameRate === 'function' ? pagFile.frameRate() : 30,
                    numLayers: typeof pagFile.numChildren === 'function' ? pagFile.numChildren() : null,
                    numImages: typeof pagFile.numImages === 'function' ? pagFile.numImages() : null,
                    numTexts: typeof pagFile.numTexts === 'function' ? pagFile.numTexts() : null
                };
                log('Meta: ' + JSON.stringify(pagMeta));

                // Force preserveDrawingBuffer and alpha for frame capture
                var origGetContext = canvas.getContext.bind(canvas);
                canvas.getContext = function(type, attrs) {
                    if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
                        attrs = Object.assign({}, attrs || {}, {
                            preserveDrawingBuffer: true,
                            premultipliedAlpha: false,
                            alpha: true
                        });
                    }
                    return origGetContext(type, attrs);
                };

                pagView = await pag.PAGView.init(pagFile, canvas, {useScale:false});
                if (!pagView) { statusEl.textContent=T('STATUS_CreateView'); return; }
                pagView.setRepeatCount(0);
                applyVolume();

                pagView.addListener('onAnimationUpdate', function() {
                    if (!isDragging && pagView) updateProgress(pagView.getProgress());
                    // Collect perf data
                    if (perfVisible && typeof pagView.getDebugData === 'function') {
                        var debug = pagView.getDebugData();
                        fpsHistory.push(debug.FPS || 0);
                        flushHistory.push(debug.flushTime || 0);
                        if (fpsHistory.length > 30) fpsHistory.shift();
                        if (flushHistory.length > 30) flushHistory.shift();
                        drawPerfGraph();
                    }
                });
                pagView.addListener('onAnimationEnd', function() {
                    if (!isLooping) { isPlaying=false; updatePlayBtn(); }
                });

                await pagView.play();
                isPlaying = true; updatePlayBtn();
                statusEl.style.display = 'none';
                log('Playing');

                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'loaded', width:pagWidth, height:pagHeight});
            } catch(err) {
                statusEl.textContent = T('STATUS_Error') + ': ' + err.message;
                log('Error: ' + err.message);
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'error', message:err.message});
            }
        }

        function updateProgress(p) {
            var pct = (p * 100).toFixed(2) + '%';
            progressFill.style.width = 'calc(' + pct + ' - 10px)';
            progressThumb.style.left = 'calc(' + pct + ')';
            timeEl.textContent = fmt(duration * p) + ' / ' + fmt(duration);
        }

        function updatePlayBtn() {
            btnPlay.querySelector('.icon').textContent = isPlaying ? ICON_PAUSE : ICON_PLAY;
        }

        // --- Progress ---
        function getProgressFromEvent(e) {
            var rect = progressWrap.getBoundingClientRect();
            return Math.max(0, Math.min(1, (e.clientX - rect.left - 10) / (rect.width - 20)));
        }

        progressWrap.addEventListener('mousedown', function(e) {
            isDragging = true; progressWrap.classList.add('dragging');
            var p = getProgressFromEvent(e); updateProgress(p);
            if (pagView) pagView.setProgress(p);
        });
        document.addEventListener('mousemove', function(e) {
            if (isDragging) { var p = getProgressFromEvent(e); updateProgress(p); if (pagView) pagView.setProgress(p); }
        });
        document.addEventListener('mouseup', function() { isDragging = false; progressWrap.classList.remove('dragging'); });

        // --- Buttons ---
        btnPlay.addEventListener('click', function() {
            if (!pagView) return;
            if (isPlaying) { pagView.pause(); isPlaying=false; } else { pagView.play(); isPlaying=true; }
            updatePlayBtn();
        });

        btnLoop.addEventListener('click', function() {
            isLooping = !isLooping;
            btnLoop.classList.toggle('active', isLooping);
            btnLoop.querySelector('.icon').textContent = isLooping ? ICON_LOOP_ON : ICON_LOOP_OFF;
            if (pagView) pagView.setRepeatCount(isLooping ? 0 : 1);
        });

        // --- Messages from C# ---
        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'loadFile') loadFile(msg.base64, msg.libpagSrc, msg.wasmSrc);
        });

        log('Page ready');
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage({type:'ready'});
    })();
    </script>
</body>
</html>
