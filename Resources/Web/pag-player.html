<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #202020;
            --fg: #cccccc;
            --fg-alt: #888888;
            --accent: #76b9ed;
            --control-bg: rgba(30,30,30,0.92);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        .icon { font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons'; font-size: 14px; }

        #container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        /* Background layer */
        #bgLayer { position: absolute; inset: 0; z-index: 0; }
        #bgLayer.checker {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        #bgLayer.checker.dark {
            background-color: #2a2a2a;
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
        }
        #bgLayer.white { background: #ffffff; }
        #bgLayer.black { background: #000000; }
        #bgLayer.default { background: var(--bg); }

        #pagCanvas { max-width: 100%; max-height: 100%; position: relative; z-index: 1; }

        /* Canvas wrapper for zoom + pan */
        #canvasWrap {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            transform-origin: center center;
        }

        /* Zoom level indicator */
        #zoomInfo {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(80,80,80,0.9); color: #fff;
            padding: 4px 14px; border-radius: 5px;
            font-size: 18px; pointer-events: none;
            opacity: 0; z-index: 20; transition: opacity 0.2s;
        }

        /* Top-right toolbar */
        #topBar {
            position: absolute; top: 8px; right: 8px;
            display: flex; gap: 4px;
            z-index: 20; opacity: 1; transition: opacity 0.3s;
        }
        #topBar.hidden { opacity: 0; pointer-events: none; }
        #topBar .btn {
            width: 24px; height: 24px;
            background: transparent; border: none; color: var(--fg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; transition: background 0.1s;
        }
        #topBar .btn:hover { background: rgba(255,255,255,0.1); }
        #topBar .btn .icon { font-size: 12px; }

        /* Color picker popup */
        #colorPicker {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px; border-radius: 4px;
            display: none; z-index: 21;
            flex-direction: column; gap: 6px;
        }
        #colorPicker.show { display: flex; }
        #colorPicker input[type="color"] {
            width: 100%; height: 28px; border: none;
            cursor: pointer; background: transparent;
        }
        .colorSwatches { display: flex; gap: 4px; }
        .swatch {
            width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; border-radius: 2px;
        }
        .swatch:hover { border-color: var(--fg); }

        /* Control bar */
        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 32px; background: var(--control-bg);
            display: flex; align-items: center; padding: 0 8px;
            opacity: 1; transition: opacity 0.3s ease; z-index: 10;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .btn {
            background: transparent; border: none; color: var(--fg);
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
            position: relative;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn:active { background: rgba(255,255,255,0.15); }
        .btn.active { color: var(--accent); }
        .btn.pinned {
            background: rgba(118,185,237,0.3);
            color: var(--accent);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        /* Progress bar */
        #progressWrap {
            flex: 1; height: 10px; margin: 0 6px;
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }
        #progressBg {
            position: absolute; left: 10px; right: 10px;
            height: 1px; background: rgba(255,255,255,0.2);
            top: 50%; transform: translateY(-50%);
        }
        #progressFill {
            position: absolute; left: 10px; width: 0;
            height: 1px; background: var(--fg);
            top: 50%; transform: translateY(-50%);
        }
        #progressThumb {
            position: absolute; left: 10px;
            width: 10px; height: 10px;
            border: 1px solid var(--fg); border-radius: 50%;
            background: transparent;
            top: 50%; transform: translate(-50%, -50%);
            opacity: 0; transition: opacity 0.15s, background 0.15s; z-index: 2;
        }
        #progressWrap:hover #progressThumb { opacity: 1; }
        #progressWrap.dragging #progressThumb { opacity: 1; background: var(--fg); }
        #progressWrap:hover #progressFill { height: 2px; }
        #progressWrap:hover #progressBg { height: 2px; }

        #time {
            color: var(--fg); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px; text-align: center;
            flex-shrink: 0; white-space: nowrap;
        }

        /* Volume slider */
        #volumeLayer {
            position: absolute; bottom: 32px; right: 8px;
            width: 130px; height: 32px;
            background: var(--control-bg);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s; z-index: 11;
        }
        #volumeLayer.show { opacity: 1; pointer-events: auto; }
        #volumeSlider {
            width: 110px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); outline: none;
            border-radius: 2px; cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: var(--fg); border-radius: 50%; cursor: pointer;
        }

        #status {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-alt); font-size: 13px; z-index: 1;
        }

        #info {
            position: absolute; top: 8px; left: 8px;
            color: var(--fg-alt); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            pointer-events: none; opacity: 0;
            transition: opacity 0.3s; z-index: 2;
            line-height: 1.4;
        }
        #info.show { opacity: 1; }
        #fpsDisplay {
            font-family: 'Consolas', monospace;
            font-weight: bold;
            font-size: 11px;
        }

        /* Toast notification */
        #toast {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%);
            background: rgba(80,80,80,0.95); color: #fff;
            padding: 6px 16px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
            opacity: 0; z-index: 30; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }

        /* Unified Info & Performance overlay (bottom-right, transparent with text shadow) */
        #perfOverlay {
            position: absolute; bottom: 40px; right: 10px;
            width: 248px; background: transparent;
            border: none; box-shadow: none; padding: 6px 8px;
            color: #f4f4f4; font-size: 10px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.85), 0 0 2px rgba(0,0,0,0.95);
            z-index: 18; display: none;
        }
        #perfOverlay.show { display: block; }
        #perfHeader {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; cursor: move; color: #d8d8d8;
            font-size: 10px; font-weight: 600;
        }
        #perfMetaGrid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 4px 6px; margin-bottom: 6px;
            padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.18);
        }
        .pm-cell { display: flex; flex-direction: column; min-width: 0; }
        .pm-k { font-size: 9px; color: #cccccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pm-v { font-size: 11px; font-weight: 600; color: #ffffff; font-family: 'Consolas', 'Segoe UI', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pm-sub {
            grid-column: 1 / -1; display: flex; justify-content: space-between;
            font-size: 9px; color: #dcdcdc; padding-top: 2px;
        }
        #perfChart {
            width: 100%; height: 48px; display: block;
            background: transparent; border-radius: 2px;
            margin-bottom: 4px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }
        .perf-row {
            display: grid; grid-template-columns: 42px 1fr 1fr 1fr;
            gap: 2px; line-height: 1.45;
            font-family: 'Consolas', 'Segoe UI', monospace;
        }
        .perf-row .p-name { color: #d0d0d0; font-family: 'Segoe UI', sans-serif; }
        .perf-row .p-val { text-align: right; color: #ffffff; }

        /* File structure & Layer inspector side drawer (independent) */
        #structPanel {
            position: absolute; top: 36px; right: 8px; bottom: 40px;
            width: 270px; background: var(--control-bg);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px; color: var(--fg); font-size: 11px;
            z-index: 21; display: none; flex-direction: column;
            box-shadow: 0 4px 16px rgba(0,0,0,0.45);
        }
        #structPanel.show { display: flex; }

        .struct-tabs {
            display: flex; border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
        }
        .struct-tab {
            flex: 1; padding: 6px 6px; text-align: center;
            background: transparent; border: none; color: var(--fg-alt);
            cursor: pointer; font-size: 11px; transition: all 0.15s;
            border-bottom: 2px solid transparent; white-space: nowrap;
        }
        .struct-tab.active {
            color: var(--accent); border-bottom-color: var(--accent);
            background: rgba(118,185,237,0.08);
        }
        .struct-body {
            flex: 1; overflow-y: auto; padding: 8px 10px;
        }
        .struct-body::-webkit-scrollbar { width: 4px; }
        .struct-body::-webkit-scrollbar-track { background: transparent; }
        .struct-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .tree-node { user-select: text; }
        .tree-row {
            display: flex; align-items: center; gap: 4px;
            padding: 2px 4px; border-radius: 2px; cursor: pointer;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tree-row:hover { background: rgba(255,255,255,0.08); }
        .tree-row.selected { background: rgba(118,185,237,0.25); color: #fff; }
        .tree-toggle {
            width: 12px; text-align: center; font-size: 9px;
            color: var(--fg-alt); flex-shrink: 0;
        }
        .tree-badge {
            font-size: 9px; padding: 0 4px; border-radius: 2px;
            background: rgba(255,255,255,0.1); color: var(--accent);
            flex-shrink: 0;
        }
        .tree-label { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .tree-prop {
            display: flex; justify-content: space-between;
            padding: 1px 4px 1px 18px; color: var(--fg-alt); font-size: 10px;
        }
        .tree-prop span:last-child { color: var(--fg); }
        .tree-children { padding-left: 12px; }
        .tree-children.collapsed { display: none; }
        .insp-empty { color: var(--fg-alt); padding: 12px 4px; text-align: center; line-height: 1.5; }
        .insp-row {
            display: flex; justify-content: space-between; padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .insp-row .k { color: var(--fg-alt); }
        .insp-row .v { color: var(--fg); text-align: right; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
        .insp-edit { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .insp-edit input[type="text"] {
            width: 100%; padding: 4px 6px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
            color: var(--fg); font-size: 11px; outline: none;
        }
        .insp-edit input[type="text"]:focus { border-color: var(--accent); }
        .insp-btn {
            padding: 4px 8px; background: rgba(118,185,237,0.2);
            border: 1px solid var(--accent); border-radius: 3px;
            color: var(--accent); cursor: pointer; font-size: 11px;
        }
        .insp-btn:hover { background: rgba(118,185,237,0.35); }
    </style>
</head>
<body>
    <div id="container">
        <div id="bgLayer" class="default"></div>
        <div id="canvasWrap">
            <canvas id="pagCanvas"></canvas>
        </div>
        <div id="zoomInfo"></div>
        <div id="info"></div>
        <div id="toast"></div>

        <!-- Top-right toolbar -->
        <div id="topBar">
            <!-- \xE8FD = File Structure -->
            <button class="btn" id="btnStruct" title="文件结构 (F)">
                <span class="icon">&#xE8FD;</span>
            </button>
            <!-- \xE946 = Info & Performance -->
            <button class="btn" id="btnMeta" title="文件信息与性能监控 (L)">
                <span class="icon">&#xE946;</span>
            </button>
            <!-- \xE74B = Save -->
            <button class="btn" id="btnSave" title="保存为PNG">
                <span class="icon">&#xE74B;</span>
            </button>
            <!-- \xEF1F = BackgroundToggle -->
            <button class="btn" id="btnBg" title="切换背景">
                <span class="icon">&#xEF1F;</span>
            </button>
        </div>
        <div id="structPanel">
            <div class="struct-tabs">
                <button class="struct-tab active" data-tab="tree" id="tabTree">文件结构</button>
                <button class="struct-tab" data-tab="inspector" id="tabInspector">图层详情</button>
            </div>
            <div class="struct-body" id="structBody"></div>
            <div class="struct-body" id="inspectorBody" style="display:none;"></div>
        </div>
        <div id="perfOverlay">
            <div id="perfHeader">
                <span id="perfTitle">文件信息与性能</span>
                <span id="perfFrameLabel">0 / 0</span>
            </div>
            <div id="perfMetaGrid"></div>
            <canvas id="perfChart" width="232" height="48"></canvas>
            <div class="perf-row"><span class="p-name" id="pFpsLabel">帧率</span><span class="p-val" id="pFpsCur">0</span><span class="p-val" id="pFpsAvg">平均 0</span><span class="p-val" id="pFpsMin">最低 0</span></div>
            <div class="perf-row"><span class="p-name" id="pFlushLabel">渲染</span><span class="p-val" id="pFlushCur">0ms</span><span class="p-val" id="pFlushAvg">平均 0</span><span class="p-val" id="pFlushMax">最高 0</span></div>
        </div>
        <div id="colorPicker">
            <div class="colorSwatches">
                <div class="swatch" data-bg="default" style="background:var(--bg)" title="默认"></div>
                <div class="swatch" data-bg="checker" style="background:repeating-conic-gradient(#e0e0e0 0% 25%, #fff 0% 50%) 50%/8px 8px" title="棋盘格"></div>
                <div class="swatch" data-bg="white" style="background:#fff" title="白色"></div>
                <div class="swatch" data-bg="black" style="background:#000" title="黑色"></div>
            </div>
            <input type="color" id="customColor" value="#202020" title="自定义颜色">
        </div>

        <div id="controls">
            <button class="btn" id="btnPlayPause" title="播放 / 暂停">
                <span class="icon">&#xE768;</span>
            </button>
            <button class="btn" id="btnPrevFrame" title="上一帧">
                <span class="icon">&#xE76B;</span>
            </button>
            <button class="btn" id="btnNextFrame" title="下一帧">
                <span class="icon">&#xE76C;</span>
            </button>
            <button class="btn active" id="btnLoop" title="循环">
                <span class="icon">&#xE777;</span>
            </button>
            <div id="progressWrap">
                <div id="progressBg"></div>
                <div id="progressFill"></div>
                <div id="progressThumb"></div>
            </div>
            <span id="time">00:00 / 00:00</span>
            <button class="btn" id="btnMute" title="音量">
                <span class="icon" id="volumeIcon">&#xE767;</span>
            </button>
        </div>
        <div id="volumeLayer">
            <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1">
        </div>
        <div id="status">加载中...</div>
    </div>

        function drawPerfChart() {
            if (!perfChart) return;
            var ctx = perfChart.getContext('2d');
            var w = perfChart.width, h = perfChart.height;
            ctx.clearRect(0, 0, w, h);
            if (perfHistory.length === 0) return;

            var maxFlush = 33;
            for (var i = 0; i < perfHistory.length; i++) {
                if (perfHistory[i].flush > maxFlush) maxFlush = perfHistory[i].flush;
            }
            var barW = w / PERF_MAX_SAMPLES;
            var startX = w - perfHistory.length * barW;
            for (var j = 0; j < perfHistory.length; j++) {
                var item = perfHistory[j];
                var bh = Math.max(2, Math.min(h - 2, (item.flush / maxFlush) * (h - 4)));
                ctx.fillStyle = item.flush <= 10 ? '#4CAF50' : (item.flush <= 20 ? '#FFC107' : '#F44336');
                ctx.fillRect(startX + j * barW, h - bh, Math.max(1, barW - 1), bh);
            }
        }

            perfHistory.push({ fps: currentFps, flush: currentFlushTime });
            if (perfHistory.length > PERF_MAX_SAMPLES) perfHistory.shift();

        // --- Capture current frame with transparent background ---
        function captureCanvas() {
            if (!pagView || !pagFile) return null;
            if (typeof pagView.flush === 'function') pagView.flush();

            var tmp = document.createElement('canvas');
            tmp.width = canvas.width;
            tmp.height = canvas.height;
            var ctx = tmp.getContext('2d');
            ctx.drawImage(canvas, 0, 0);

            // Remove black background
            var imageData = ctx.getImageData(0, 0, tmp.width, tmp.height);
            var data = imageData.data;
            for (var i = 0; i < data.length; i += 4) {
                if (data[i] < 10 && data[i+1] < 10 && data[i+2] < 10) {
                    data[i+3] = 0;
                }
            }
            ctx.putImageData(imageData, 0, 0);
            return tmp;
        }

        // --- Load PAG ---
        async function loadFile(base64, libpagSrc, wasmSrc) {
            try {
                statusEl.textContent = T('STATUS_InitLibpag');
                if (!pag) {
                    var s = document.createElement('script');
                    s.src = libpagSrc;
                    document.head.appendChild(s);
                    await new Promise(function(ok, fail) { s.onload=ok; s.onerror=function(){fail(new Error('load libpag.js failed'))}; });
                    statusEl.textContent = T('STATUS_InitPAG');
                    pag = await window.libpag.PAGInit({locateFile:function(){return wasmSrc}});
                    log('PAG initialized');
                }
                if (pagView) { try{pagView.destroy();}catch(e){} pagView=null; }
                if (pagFile) { try{pagFile.destroy();}catch(e){} pagFile=null; }

                statusEl.textContent = T('STATUS_Decoding');
                var raw = atob(base64);
                var buf = new Uint8Array(raw.length);
                for (var i=0;i<raw.length;i++) buf[i]=raw.charCodeAt(i);
                var ab = buf.buffer.slice(buf.byteOffset, buf.byteOffset+buf.byteLength);
                pagFile = await pag.PAGFile.load(ab);
                if (!pagFile) { statusEl.textContent=T('STATUS_InvalidFile'); return; }

                duration = pagFile.duration();
                pagWidth = pagFile.width();
                pagHeight = pagFile.height();
                infoEl.innerHTML = pagWidth + '\u00d7' + pagHeight + '<br><span id="fpsDisplay">0 FPS</span>';
                canvas.width = pagWidth; canvas.height = pagHeight;

                // Collect metadata
                var fileProps = Object.getOwnPropertyNames(Object.getPrototypeOf(pagFile)).filter(function(k) { return typeof pagFile[k] === 'function'; });
                log('PAGFile methods: ' + fileProps.join(', '));
                
                pagMeta = {
                    fps: typeof pagFile.frameRate === 'function' ? pagFile.frameRate() : 30,
                    numLayers: typeof pagFile.numChildren === 'function' ? pagFile.numChildren() : null,
                    numImages: typeof pagFile.numImages === 'function' ? pagFile.numImages() : null,
                    numTexts: typeof pagFile.numTexts === 'function' ? pagFile.numTexts() : null,
                    numVideos: typeof pagFile.numVideos === 'function' ? pagFile.numVideos() : null,
                    tagLevel: typeof pagFile.tagLevel === 'function' ? pagFile.tagLevel() : null,
                    timeStretchMode: typeof pagFile.timeStretchMode === 'function' ? pagFile.timeStretchMode() : null,
                    maxTagLevel: (typeof pag.PAGFile !== 'undefined' && typeof pag.PAGFile.maxSupportedTagLevel === 'function') ? pag.PAGFile.maxSupportedTagLevel() : null,
                    fileSize: fileSize
                };
                totalFrames = Math.round(duration / 1000000 * pagMeta.fps);
                infoEl.innerHTML = pagWidth + '\u00d7' + pagHeight + ' (' + totalFrames + 'f)<br><span id="fpsDisplay">0 FPS</span>';
                log('Meta: ' + JSON.stringify(pagMeta));
                perfHistory = [];
                selectedLayer = null;
                refreshStructureTree();
                renderInspector(null);

                // Force preserveDrawingBuffer and alpha for frame capture
                var origGetContext = canvas.getContext.bind(canvas);
                canvas.getContext = function(type, attrs) {
                    if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
                        attrs = Object.assign({}, attrs || {}, {
                            preserveDrawingBuffer: true,
                            premultipliedAlpha: false,
                            alpha: true
                        });
                    }
                    return origGetContext(type, attrs);
                };

                pagView = await pag.PAGView.init(pagFile, canvas, {useScale:false});
                if (!pagView) { statusEl.textContent=T('STATUS_CreateView'); return; }
                pagView.setRepeatCount(0);
                applyVolume();

                pagView.addListener('onAnimationUpdate', function() {
                    if (!isDragging && pagView) updateProgress(pagView.getProgress());
                    // Update perf data
                    if (typeof pagView.getDebugData === 'function') {
                        var debug = pagView.getDebugData();
                        currentFps = Math.round(debug.FPS || 0);
                        currentFlushTime = debug.flushTime || 0;
                        updatePerfDisplay();
                    }
                });
                pagView.addListener('onAnimationEnd', function() {
                    if (!isLooping) { isPlaying=false; updatePlayBtn(); }
                });

                await pagView.play();
                isPlaying = true; updatePlayBtn();
                statusEl.style.display = 'none';
                log('Playing');

                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'loaded', width:pagWidth, height:pagHeight});
            } catch(err) {
                statusEl.textContent = T('STATUS_Error') + ': ' + err.message;
                log('Error: ' + err.message);
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'error', message:err.message});
            }
        }

        function updateProgress(p) {
            var pct = (p * 100).toFixed(2) + '%';
            progressFill.style.width = 'calc(' + pct + ' - 10px)';
            progressThumb.style.left = 'calc(' + pct + ')';
            var currentFrame = Math.round(p * totalFrames);
            timeEl.textContent = fmt(duration * p) + ' / ' + fmt(duration) + '  ' + currentFrame + '/' + totalFrames;
        }

        function updatePlayBtn() {
            btnPlay.querySelector('.icon').textContent = isPlaying ? ICON_PAUSE : ICON_PLAY;
        }

        // --- Progress ---
        function getProgressFromEvent(e) {
            var rect = progressWrap.getBoundingClientRect();
            return Math.max(0, Math.min(1, (e.clientX - rect.left - 10) / (rect.width - 20)));
        }

        progressWrap.addEventListener('mousedown', function(e) {
            isDragging = true; progressWrap.classList.add('dragging');
            var p = getProgressFromEvent(e); updateProgress(p);
            if (pagView) pagView.setProgress(p);
        });
        document.addEventListener('mousemove', function(e) {
            if (isDragging) { var p = getProgressFromEvent(e); updateProgress(p); if (pagView) pagView.setProgress(p); }
        });
        document.addEventListener('mouseup', function() { isDragging = false; progressWrap.classList.remove('dragging'); });

        // --- Buttons ---
        btnPlay.addEventListener('click', function() {
            if (!pagView) return;
            if (isPlaying) { pagView.pause(); isPlaying=false; } else { pagView.play(); isPlaying=true; }
            updatePlayBtn();
        });

        btnLoop.addEventListener('click', function() {
            isLooping = !isLooping;
            btnLoop.classList.toggle('active', isLooping);
            btnLoop.querySelector('.icon').textContent = isLooping ? ICON_LOOP_ON : ICON_LOOP_OFF;
            if (pagView) pagView.setRepeatCount(isLooping ? 0 : 1);
        });

        // --- Frame stepping ---
        function stepFrame(delta) {
            if (!pagView || !pagFile || totalFrames <= 0) return;
            if (isPlaying) { pagView.pause(); isPlaying = false; updatePlayBtn(); }
            var currentFrame = Math.round(pagView.getProgress() * totalFrames);
            var nextFrame = Math.max(0, Math.min(totalFrames - 1, currentFrame + delta));
            var newProgress = nextFrame / totalFrames;
            pagView.setProgress(newProgress);
            if (typeof pagView.flush === 'function') pagView.flush();
            updateProgress(newProgress);
        }

        btnPrevFrame.addEventListener('click', function() { stepFrame(-1); });
        btnNextFrame.addEventListener('click', function() { stepFrame(1); });

        // --- File Structure & Layer Inspector (independent side drawer) ---
        var structVisible = false;
        var selectedLayer = null;
        var layerNodeMap = [];

        function toggleStruct(forceOpen) {
            structVisible = typeof forceOpen === 'boolean' ? forceOpen : !structVisible;
            if (btnStruct) btnStruct.classList.toggle('pinned', structVisible);
            if (structPanel) structPanel.classList.toggle('show', structVisible);
        }
        if (btnStruct) btnStruct.addEventListener('click', function(e) { e.stopPropagation(); toggleStruct(); });

        document.querySelectorAll('.struct-tab').forEach(function(tab) {
            tab.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.struct-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                var name = tab.dataset.tab;
                if (structBody) structBody.style.display = name === 'tree' ? 'block' : 'none';
                if (inspectorBody) inspectorBody.style.display = name === 'inspector' ? 'block' : 'none';
            });
        });

        function switchStructTab(tabName) {
            var target = document.querySelector('.struct-tab[data-tab="' + tabName + '"]');
            if (target) target.click();
        }

        function getLayerRawType(layer) {
            return layer && typeof layer.layerType === 'function' ? layer.layerType() : 0;
        }

        function getLayerTypeName(layer) {
            if (!layer || typeof layer.layerType !== 'function') return T('LAYER_Unknown');
            var t = layer.layerType();
            var keys = ['LAYER_Unknown', 'LAYER_Null', 'LAYER_Solid', 'LAYER_Text', 'LAYER_Shape', 'LAYER_Image', 'LAYER_PreCompose', 'LAYER_Camera'];
            return keys[t] ? T(keys[t]) : (T('LAYER_Unknown') + '#' + t);
        }

        function safeVal(obj, fn) {
            try { return obj && typeof obj[fn] === 'function' ? obj[fn]() : null; }
            catch (e) { return null; }
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function buildLayerHtml(layer, depth) {
            var name = safeVal(layer, 'layerName') || T('INSP_Unnamed');
            var typeName = getLayerTypeName(layer);
            var nChildren = safeVal(layer, 'numChildren') || 0;
            var editableIdx = safeVal(layer, 'editableIndex');
            var id = layerNodeMap.length;
            layerNodeMap.push(layer);

            var badge = typeName + (editableIdx != null && editableIdx >= 0 ? ' #' + editableIdx : '');
            var toggleChar = nChildren > 0 ? '&#x25BE;' : '&#x2022;';
            var html = '<div class="tree-node" data-node-id="' + id + '">';
            html += '<div class="tree-row" data-node-id="' + id + '">';
            html += '<span class="tree-toggle">' + toggleChar + '</span>';
            html += '<span class="tree-badge">' + escapeHtml(badge) + '</span>';
            html += '<span class="tree-label" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span>';
            html += '</div>';

            if (nChildren > 0) {
                html += '<div class="tree-children">';
                for (var i = 0; i < nChildren; i++) {
                    var child = layer.getLayerAt(i);
                    if (child) html += buildLayerHtml(child, depth + 1);
                }
                html += '</div>';
            }
            html += '</div>';
            return html;
        }

        function refreshStructureTree() {
            if (!structBody || !pagFile) return;
            layerNodeMap = [];
            var sm = safeVal(pagFile, 'timeStretchMode');
            var html = '<div class="tree-node">';
            html += '<div class="tree-row"><span class="tree-toggle">&#x25BE;</span><span class="tree-badge">' + escapeHtml(T('TREE_File')) + '</span><span class="tree-label">' + escapeHtml(T('TREE_Root')) + '</span></div>';
            html += '<div class="tree-children">';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('META_TimeStretch')) + '</span><span>' + escapeHtml(getStretchModeText(sm)) + '</span></div>';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('META_Duration')) + '</span><span>' + totalFrames + 'f (' + (duration / 1000000).toFixed(2) + 's)</span></div>';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('META_FPS')) + '</span><span>' + (pagMeta ? pagMeta.fps : '-') + '</span></div>';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('TREE_Size')) + '</span><span>' + pagWidth + ' × ' + pagHeight + '</span></div>';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('META_TagLevel')) + '</span><span>' + (pagMeta && pagMeta.tagLevel != null ? pagMeta.tagLevel : '-') + '</span></div>';
            html += '<div class="tree-prop"><span>' + escapeHtml(T('TREE_VideosLayers')) + '</span><span>' + (pagMeta && pagMeta.numVideos != null ? pagMeta.numVideos : '-') + ' / ' + (pagMeta && pagMeta.numLayers != null ? pagMeta.numLayers : '-') + '</span></div>';
            var n = safeVal(pagFile, 'numChildren') || 0;
            for (var i = 0; i < n; i++) {
                var child = pagFile.getLayerAt(i);
                if (child) html += buildLayerHtml(child, 0);
            }
            html += '</div></div>';
            structBody.innerHTML = html;

            structBody.querySelectorAll('.tree-row[data-node-id]').forEach(function(row) {
                row.addEventListener('click', function(e) {
                    var id = parseInt(row.dataset.nodeId, 10);
                    var node = row.parentElement;
                    var childrenEl = node.querySelector(':scope > .tree-children');
                    if (e.target.classList.contains('tree-toggle') && childrenEl) {
                        var collapsed = childrenEl.classList.toggle('collapsed');
                        e.target.innerHTML = collapsed ? '&#x25B8;' : '&#x25BE;';
                        return;
                    }
                    structBody.querySelectorAll('.tree-row.selected').forEach(function(r) { r.classList.remove('selected'); });
                    row.classList.add('selected');
                    selectedLayer = layerNodeMap[id] || null;
                    renderInspector(selectedLayer);
                });
            });
        }

        function renderInspector(layer) {
            if (!inspectorBody) return;
            if (!layer) {
                inspectorBody.innerHTML = '<div class="insp-empty">' + T('INSP_Empty') + '</div>';
                return;
            }
            var rawType = getLayerRawType(layer);
            var typeName = getLayerTypeName(layer);
            var name = safeVal(layer, 'layerName') || T('INSP_Unnamed');
            var st = safeVal(layer, 'startTime');
            var dur = safeVal(layer, 'duration');
            var alpha = safeVal(layer, 'alpha');
            var visible = safeVal(layer, 'visible');
            var editableIdx = safeVal(layer, 'editableIndex');
            var visibleText = visible === true ? T('BOOL_True') : (visible === false ? T('BOOL_False') : '-');

            var html = ''
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_Name')) + '</span><span class="v" title="' + escapeHtml(name) + '">' + escapeHtml(name) + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_Type')) + '</span><span class="v">' + escapeHtml(typeName) + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_StartTime')) + '</span><span class="v">' + (st != null ? (st / 1000000).toFixed(2) + 's' : '-') + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_Duration')) + '</span><span class="v">' + (dur != null ? (dur / 1000000).toFixed(2) + 's' : '-') + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_Alpha')) + '</span><span class="v">' + (alpha != null ? alpha.toFixed(2) : '-') + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_Visible')) + '</span><span class="v">' + escapeHtml(visibleText) + '</span></div>'
                + '<div class="insp-row"><span class="k">' + escapeHtml(T('INSP_EditableIndex')) + '</span><span class="v">' + (editableIdx != null ? editableIdx : '-') + '</span></div>';

            if (rawType === 3 && editableIdx != null && editableIdx >= 0 && pagFile) {
                var textDoc = null;
                try { textDoc = pagFile.getTextData(editableIdx); } catch (e) {}
                var curText = textDoc && textDoc.text ? textDoc.text : '';
                html += '<div class="insp-edit"><input type="text" id="inspTextInput" value="' + escapeHtml(curText) + '">'
                    + '<button class="insp-btn" id="btnApplyText">' + T('INSP_ApplyText') + '</button></div>';
            } else if (rawType === 5 && editableIdx != null && editableIdx >= 0 && pagFile) {
                html += '<div class="insp-edit"><input type="file" id="inspImgInput" accept="image/*" style="display:none">'
                    + '<button class="insp-btn" id="btnReplaceImg">' + T('INSP_ReplaceImage') + '</button></div>';
            }

            inspectorBody.innerHTML = html;

            var btnApplyText = document.getElementById('btnApplyText');
            if (btnApplyText) {
                btnApplyText.addEventListener('click', function() {
                    var val = document.getElementById('inspTextInput').value;
                    try {
                        var td = pagFile.getTextData(editableIdx);
                        td.text = val;
                        pagFile.replaceText(editableIdx, td);
                        if (typeof pagView.flush === 'function') pagView.flush();
                        showToast(T('TOAST_TextUpdated'));
                    } catch (err) { log('replaceText failed: ' + err.message); }
                });
            }

            var btnReplaceImg = document.getElementById('btnReplaceImg');
            var inspImgInput = document.getElementById('inspImgInput');
            if (btnReplaceImg && inspImgInput) {
                btnReplaceImg.addEventListener('click', function() { inspImgInput.click(); });
                inspImgInput.addEventListener('change', function() {
                    var file = inspImgInput.files && inspImgInput.files[0];
                    if (!file) return;
                    var img = new Image();
                    img.onload = async function() {
                        try {
                            var pagImg = await pag.PAGImage.fromSource(img);
                            pagFile.replaceImage(editableIdx, pagImg);
                            if (typeof pagView.flush === 'function') pagView.flush();
                            showToast(T('TOAST_ImageUpdated'));
                        } catch (err) { log('replaceImage failed: ' + err.message); }
                    };
                    img.src = URL.createObjectURL(file);
                });
            }
        }

        function inspectCanvasPoint(e) {
            if (!pagView || typeof pagView.getLayersUnderPoint !== 'function') return;
            var rect = canvas.getBoundingClientRect();
            if (rect.width <= 0 || rect.height <= 0) return;
            var x = (e.clientX - rect.left) * (canvas.width / rect.width);
            var y = (e.clientY - rect.top) * (canvas.height / rect.height);
            try {
                var layers = pagView.getLayersUnderPoint(x, y);
                if (layers && layers.length > 0) {
                    var topLayer = layers[0];
                    selectedLayer = topLayer;
                    renderInspector(topLayer);
                    if (structVisible) switchStructTab('inspector');
                    else showToast((safeVal(topLayer, 'layerName') || T('INSP_Unnamed')) + ' (' + getLayerTypeName(topLayer) + ')');
                }
            } catch (err) {}
        }

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); showControls(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); showControls(); }
            else if (e.key === ' ') { e.preventDefault(); btnPlay.click(); showControls(); }
            else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleMetaPanel(); showControls(); }
            else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleStruct(); showControls(); }
        });

        // --- Messages from C# ---
        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'loadFile') { fileSize = msg.fileSize || 0; loadFile(msg.base64, msg.libpagSrc, msg.wasmSrc); }
        });

        log('Page ready');
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage({type:'ready'});
    })();
    </script>
</body>
</html>
